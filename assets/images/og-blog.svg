<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#123152"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="6" fill="#00C87A"/>

  <text x="60" y="96" fill="#00E5A0" font-size="14" font-weight="700" letter-spacing="3">ROBIN DES AIRS</text>
  <text x="60" y="152" fill="#FFFFFF" font-size="44" font-weight="700">Vol retardé, annulé, bagage perdu ?</text>
  <text x="60" y="200" fill="#8FE8C4" font-size="26" font-weight="600">On prend aux compagnies, on rend aux familles.</text>

  <!-- 3 etapes -->
  <g transform="translate(60,262)">
    <!-- 1 -->
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#FFFFFF" opacity="0.07"/>
    <rect x="0" y="0" width="4" height="150" rx="2" fill="#00C87A"/>
    <text x="24" y="40" fill="#00E5A0" font-size="26" font-weight="700">1</text>
    <text x="24" y="76" fill="#FFFFFF" font-size="19" font-weight="700">Vous vérifiez</text>
    <text x="24" y="104" fill="#8FA6C0" font-size="15">Gratuit, en 2 minutes,</text>
    <text x="24" y="126" fill="#8FA6C0" font-size="15">sur WhatsApp.</text>

    <!-- 2 -->
    <rect x="340" y="0" width="300" height="150" rx="12" fill="#FFFFFF" opacity="0.07"/>
    <rect x="340" y="0" width="4" height="150" rx="2" fill="#00C87A"/>
    <text x="364" y="40" fill="#00E5A0" font-size="26" font-weight="700">2</text>
    <text x="364" y="76" fill="#FFFFFF" font-size="19" font-weight="700">On réclame</text>
    <text x="364" y="104" fill="#8FA6C0" font-size="15">On monte le dossier et</text>
    <text x="364" y="126" fill="#8FA6C0" font-size="15">on conteste les refus.</text>

    <!-- 3 -->
    <rect x="680" y="0" width="300" height="150" rx="12" fill="#FFFFFF" opacity="0.07"/>
    <rect x="680" y="0" width="4" height="150" rx="2" fill="#00C87A"/>
    <text x="704" y="40" fill="#00E5A0" font-size="26" font-weight="700">3</text>
    <text x="704" y="76" fill="#FFFFFF" font-size="19" font-weight="700">Vous recevez</text>
    <text x="704" y="104" fill="#8FA6C0" font-size="15">Versé sous 5 jours après</text>
    <text x="704" y="126" fill="#8FA6C0" font-size="15">encaissement.</text>
  </g>

  <!-- chiffres cles -->
  <g transform="translate(60,452)">
    <text x="0" y="34" fill="#00E5A0" font-size="42" font-weight="700">600 €</text>
    <text x="0" y="62" fill="#8FA6C0" font-size="15">par passager, max.</text>

    <line x1="200" y1="4" x2="200" y2="66" stroke="#28405C" stroke-width="1.5"/>

    <text x="240" y="34" fill="#00E5A0" font-size="42" font-weight="700">0 €</text>
    <text x="240" y="62" fill="#8FA6C0" font-size="15">si rien n'est récupéré.</text>

    <line x1="470" y1="4" x2="470" y2="66" stroke="#28405C" stroke-width="1.5"/>

    <text x="510" y="34" fill="#00E5A0" font-size="42" font-weight="700">5 ans</text>
    <text x="510" y="62" fill="#8FA6C0" font-size="15">pour réclamer.</text>
  </g>

  <rect x="0" y="574" width="1200" height="56" fill="#071528"/>
  <text x="60" y="609" fill="#FFFFFF" font-size="16" font-weight="700">Spécialiste des vols Afrique · Europe</text>
  <text x="1140" y="609" fill="#00E5A0" font-size="16" font-weight="700" text-anchor="end">robindesairs.eu</text>
</svg>
