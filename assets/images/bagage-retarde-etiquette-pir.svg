<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#123152"/>
    </linearGradient>
    <linearGradient id="tagfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#00C87A"/>

  <!-- Titre -->
  <text x="60" y="74" fill="#FFFFFF" font-size="34" font-weight="700">Bagage retardé : les 2 papiers qui valent votre dossier</text>
  <text x="60" y="108" fill="#8FE8C4" font-size="19" font-weight="600">Sans eux, la Convention de Montréal ne vous sert à rien.</text>

  <!-- ====================== ÉTIQUETTE BAGAGE ====================== -->
  <g transform="translate(60,150)">
    <text x="0" y="0" fill="#00E5A0" font-size="13" font-weight="700" letter-spacing="2.4">1 · LE TALON D'ÉTIQUETTE</text>

    <!-- corps de l'étiquette -->
    <rect x="0" y="18" width="200" height="392" rx="10" fill="url(#tagfade)"/>
    <rect x="0" y="18" width="200" height="392" rx="10" fill="none" stroke="#C9D3E0" stroke-width="1.5"/>
    <rect x="0" y="18" width="200" height="52" rx="10" fill="#0B1F3A"/>
    <rect x="0" y="52" width="200" height="18" fill="#0B1F3A"/>
    <text x="14" y="52" fill="#FFFFFF" font-size="17" font-weight="700">TALON PASSAGER</text>
    <text x="14" y="66" fill="#8FA6C0" font-size="9.5" letter-spacing="1">BAGGAGE IDENTIFICATION TAG</text>

    <!-- destination -->
    <text x="14" y="104" fill="#6B7C91" font-size="10" letter-spacing="1.4">DESTINATION</text>
    <text x="14" y="146" fill="#0B1F3A" font-size="44" font-weight="700" letter-spacing="2">ACC</text>
    <line x1="14" y1="160" x2="186" y2="160" stroke="#DDE4EC" stroke-width="1.5"/>

    <!-- numéro -->
    <text x="14" y="182" fill="#6B7C91" font-size="10" letter-spacing="1.4">N° DE BAGAGE</text>
    <text x="14" y="208" fill="#0B1F3A" font-size="23" font-weight="700" letter-spacing="1">XX 123456</text>
    <line x1="14" y1="222" x2="186" y2="222" stroke="#DDE4EC" stroke-width="1.5"/>

    <!-- code-barres -->
    <g transform="translate(14,240)" fill="#0B1F3A">
      <rect x="0" y="0" width="3" height="86"/><rect x="6" y="0" width="1.5" height="86"/>
      <rect x="11" y="0" width="4" height="86"/><rect x="18" y="0" width="1.5" height="86"/>
      <rect x="23" y="0" width="2" height="86"/><rect x="29" y="0" width="4.5" height="86"/>
      <rect x="37" y="0" width="1.5" height="86"/><rect x="42" y="0" width="3" height="86"/>
      <rect x="49" y="0" width="2" height="86"/><rect x="55" y="0" width="4" height="86"/>
      <rect x="63" y="0" width="1.5" height="86"/><rect x="68" y="0" width="3.5" height="86"/>
      <rect x="75" y="0" width="2" height="86"/><rect x="81" y="0" width="1.5" height="86"/>
      <rect x="86" y="0" width="4" height="86"/><rect x="94" y="0" width="2" height="86"/>
      <rect x="100" y="0" width="3" height="86"/><rect x="107" y="0" width="1.5" height="86"/>
      <rect x="112" y="0" width="4.5" height="86"/><rect x="120" y="0" width="2" height="86"/>
      <rect x="126" y="0" width="3" height="86"/><rect x="133" y="0" width="1.5" height="86"/>
      <rect x="138" y="0" width="4" height="86"/><rect x="146" y="0" width="2" height="86"/>
      <rect x="152" y="0" width="3" height="86"/><rect x="159" y="0" width="1.5" height="86"/>
      <rect x="164" y="0" width="4" height="86"/><rect x="172" y="0" width="0" height="86"/>
    </g>
    <text x="14" y="346" fill="#0B1F3A" font-size="12" letter-spacing="3">0 123456 789012</text>

    <text x="14" y="374" fill="#6B7C91" font-size="10" letter-spacing="1.4">VOL / DATE</text>
    <text x="14" y="394" fill="#0B1F3A" font-size="14" font-weight="700">XX 0000 · 00 JAN</text>

  </g>

  <!-- flèche annotation étiquette -->
  <g stroke="#00E5A0" stroke-width="2.5" fill="none">
    <path d="M262 358 L 316 358" stroke-dasharray="0"/>
    <path d="M310 352 L 318 358 L 310 364" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="272" y="330" fill="#00E5A0" font-size="14" font-weight="700">Ce numéro</text>
  <text x="272" y="348" fill="#00E5A0" font-size="14" font-weight="700">= votre bagage</text>

  <!-- règle clé, dans le vide à droite du talon -->
  <g transform="translate(266,404)">
    <rect x="0" y="0" width="132" height="140" rx="8" fill="#FFFFFF" opacity="0.06"/>
    <rect x="0" y="0" width="3" height="140" rx="1.5" fill="#00C87A"/>
    <text x="16" y="26" fill="#FFFFFF" font-size="13" font-weight="700">À L'ALLER</text>
    <text x="16" y="46" fill="#8FA6C0" font-size="12">loin de chez vous :</text>
    <text x="16" y="63" fill="#00E5A0" font-size="12" font-weight="700">rachat justifié</text>
    <line x1="16" y1="79" x2="116" y2="79" stroke="#28405C" stroke-width="1.5"/>
    <text x="16" y="100" fill="#FFFFFF" font-size="13" font-weight="700">AU RETOUR</text>
    <text x="16" y="120" fill="#8FA6C0" font-size="12">à votre domicile :</text>
    <text x="16" y="137" fill="#FF9B9B" font-size="12" font-weight="700">presque jamais</text>
  </g>

  <!-- ====================== PIR ====================== -->
  <g transform="translate(430,150)">
    <text x="0" y="0" fill="#00E5A0" font-size="13" font-weight="700" letter-spacing="2.4">2 · LE PIR (PROPERTY IRREGULARITY REPORT)</text>

    <rect x="0" y="18" width="450" height="392" rx="10" fill="#FFFFFF"/>
    <rect x="0" y="18" width="450" height="392" rx="10" fill="none" stroke="#C9D3E0" stroke-width="1.5"/>
    <rect x="0" y="18" width="450" height="46" rx="10" fill="#EEF2F7"/>
    <rect x="0" y="46" width="450" height="18" fill="#EEF2F7"/>
    <line x1="0" y1="64" x2="450" y2="64" stroke="#C9D3E0" stroke-width="1.5"/>

    <text x="18" y="48" fill="#0B1F3A" font-size="15" font-weight="700">CONSTAT D'IRRÉGULARITÉ BAGAGE</text>
    <text x="330" y="48" fill="#6B7C91" font-size="11" letter-spacing="1">P.I.R.</text>

    <!-- champs -->
    <text x="18" y="92" fill="#6B7C91" font-size="10.5" letter-spacing="1.2">RÉFÉRENCE DU DOSSIER</text>
    <rect x="18" y="100" width="200" height="30" rx="4" fill="#F4F7FA" stroke="#DDE4EC"/>
    <text x="28" y="121" fill="#0B1F3A" font-size="16" font-weight="700" letter-spacing="1.5">ACCXX00000</text>

    <text x="248" y="92" fill="#6B7C91" font-size="10.5" letter-spacing="1.2">DATE ET HEURE</text>
    <rect x="248" y="100" width="184" height="30" rx="4" fill="#F4F7FA" stroke="#DDE4EC"/>
    <text x="258" y="121" fill="#0B1F3A" font-size="14">00/00/0000 · 00h00</text>

    <text x="18" y="158" fill="#6B7C91" font-size="10.5" letter-spacing="1.2">NATURE DE L'IRRÉGULARITÉ</text>
    <g transform="translate(18,168)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#00C87A"/>
      <path d="M4 8 L 7 11 L 12 5" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="13" fill="#0B1F3A" font-size="13.5" font-weight="700">Bagage retardé (non arrivé)</text>

      <rect x="216" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#B9C4D2" stroke-width="1.5"/>
      <text x="240" y="13" fill="#6B7C91" font-size="13.5">Endommagé</text>

      <rect x="0" y="26" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#B9C4D2" stroke-width="1.5"/>
      <text x="24" y="39" fill="#6B7C91" font-size="13.5">Pillé / contenu manquant</text>

      <rect x="216" y="26" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#B9C4D2" stroke-width="1.5"/>
      <text x="240" y="39" fill="#6B7C91" font-size="13.5">Perdu</text>
    </g>

    <text x="18" y="248" fill="#6B7C91" font-size="10.5" letter-spacing="1.2">N° D'ÉTIQUETTE BAGAGE</text>
    <rect x="18" y="256" width="200" height="30" rx="4" fill="#F4F7FA" stroke="#DDE4EC"/>
    <text x="28" y="277" fill="#0B1F3A" font-size="15" font-weight="700" letter-spacing="1">XX 123456</text>

    <text x="248" y="248" fill="#6B7C91" font-size="10.5" letter-spacing="1.2">PASSAGER</text>
    <rect x="248" y="256" width="184" height="30" rx="4" fill="#F4F7FA" stroke="#DDE4EC"/>
    <text x="258" y="277" fill="#0B1F3A" font-size="14">NOM / Prénom</text>

    <text x="18" y="314" fill="#6B7C91" font-size="10.5" letter-spacing="1.2">ADRESSE DE LIVRAISON SUR PLACE</text>
    <rect x="18" y="322" width="414" height="30" rx="4" fill="#F4F7FA" stroke="#DDE4EC"/>
    <text x="28" y="343" fill="#0B1F3A" font-size="14">Hôtel / famille / lieu de séjour</text>

    <line x1="18" y1="370" x2="432" y2="370" stroke="#E4E9F0" stroke-width="1.5"/>
    <text x="18" y="392" fill="#6B7C91" font-size="11.5">Établi au comptoir « Bagages », avant de quitter l'aéroport.</text>

    <!-- filigrane -->
    <g transform="translate(225,214) rotate(-24)" opacity="0.13">
      <text x="0" y="0" fill="#0B1F3A" font-size="62" font-weight="700" letter-spacing="6" text-anchor="middle">EXEMPLE</text>
    </g>
  </g>

  <!-- bandeau bas -->
  <rect x="0" y="574" width="1200" height="56" fill="#071528"/>
  <text x="60" y="609" fill="#FFFFFF" font-size="16" font-weight="700">Jusqu'à ~1 800 € par passager, sur justificatifs.</text>
  <text x="512" y="609" fill="#8FA6C0" font-size="15">Illustration pédagogique · document fictif, sans valeur</text>
  <text x="1140" y="609" fill="#00E5A0" font-size="16" font-weight="700" text-anchor="end">Robin des Airs</text>
</svg>
