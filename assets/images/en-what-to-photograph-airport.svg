<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">What to photograph at the airport</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Without the clock in the frame, the photo proves nothing.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <text x="56" y="128" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">1 · THE DEPARTURE BOARD</text>

  <rect x="56" y="142" width="640" height="250" rx="10" fill="#0A1420"/>
  <rect x="56" y="142" width="640" height="38" rx="10" fill="#16233A"/>
  <rect x="56" y="168" width="640" height="12" fill="#16233A"/>
  <text x="76" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">TIME</text>
  <text x="168" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">FLIGHT</text>
  <text x="268" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">DESTINATION</text>
  <text x="462" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">GATE</text>
  <text x="540" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">STATUS</text>

  <text x="76" y="212" fill="#E8EEF7" font-size="17" font-weight="700">19:40</text>
  <text x="168" y="212" fill="#E8EEF7" font-size="17" font-weight="700">AF 718</text>
  <text x="268" y="212" fill="#E8EEF7" font-size="17">ABIDJAN</text>
  <text x="462" y="212" fill="#E8EEF7" font-size="17">K 42</text>
  <text x="540" y="212" fill="#3DDC97" font-size="17" font-weight="700">À L'TIME</text>

  <rect x="64" y="228" width="624" height="46" rx="7" fill="#2A2010" stroke="#E8A020" stroke-width="2"/>
  <text x="76" y="258" fill="#FFFFFF" font-size="17" font-weight="700">20:15</text>
  <text x="168" y="258" fill="#FFFFFF" font-size="17" font-weight="800">SN 281</text>
  <text x="268" y="258" fill="#FFFFFF" font-size="17" font-weight="700">KINSHASA</text>
  <text x="462" y="258" fill="#FFFFFF" font-size="17">B 38</text>
  <text x="540" y="252" fill="#F5B33C" font-size="16" font-weight="800">DELAYED</text>
  <text x="540" y="270" fill="#F5B33C" font-size="14" font-weight="700">new time 23:05</text>

  <text x="76" y="304" fill="#E8EEF7" font-size="17" font-weight="700">20:55</text>
  <text x="168" y="304" fill="#E8EEF7" font-size="17" font-weight="700">AT 785</text>
  <text x="268" y="304" fill="#E8EEF7" font-size="17">CASABLANCA</text>
  <text x="462" y="304" fill="#E8EEF7" font-size="17">—</text>
  <text x="540" y="304" fill="#F0645A" font-size="17" font-weight="800">CANCELLED</text>

  <text x="76" y="346" fill="#E8EEF7" font-size="17" font-weight="700">21:30</text>
  <text x="168" y="346" fill="#E8EEF7" font-size="17" font-weight="700">TP 1455</text>
  <text x="268" y="346" fill="#E8EEF7" font-size="17">LISBON</text>
  <text x="462" y="346" fill="#E8EEF7" font-size="17">C 12</text>
  <text x="540" y="346" fill="#3DDC97" font-size="17" font-weight="700">BOARDING</text>

  <rect x="452" y="356" width="236" height="28" rx="14" fill="#16233A"/>
  <text x="470" y="375" fill="#5C6E88" font-size="12" font-weight="700" letter-spacing=".4">TIME ÉCRAN</text>
  <text x="672" y="376" fill="#8FA3BF" font-size="15" font-weight="800" text-anchor="end">20:47</text>

  <text x="736" y="128" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">2 · THE GATE SCREEN</text>
  <rect x="736" y="142" width="408" height="250" rx="10" fill="#0A1420"/>
  <text x="940" y="196" fill="#8FA3BF" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">GATE B 38</text>
  <text x="940" y="240" fill="#FFFFFF" font-size="30" font-weight="800" text-anchor="middle">SN 281</text>
  <text x="940" y="272" fill="#E8EEF7" font-size="20" text-anchor="middle">KINSHASA</text>
  <rect x="796" y="292" width="288" height="40" rx="20" fill="#E8A020"/>
  <text x="940" y="319" fill="#241A05" font-size="17" font-weight="800" text-anchor="middle">DELAYED · 23:05</text>
  <text x="940" y="356" fill="#F5B33C" font-size="15" font-weight="700" text-anchor="middle">Technical issue</text>
  <text x="940" y="378" fill="#5C6E88" font-size="13" text-anchor="middle">the reason sometimes shows up here</text>

  <rect x="56" y="410" width="640" height="82" rx="12" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="80" y="440" fill="#0B1F3A" font-size="16" font-weight="800">What to fit in the shot</text>
  <text x="80" y="466" fill="#374151" font-size="14.5">The flight number, destination, scheduled time, status,</text>
  <text x="80" y="486" fill="#374151" font-size="14.5">the new time announced, and <tspan font-weight="800" fill="#047857">the clock on the screen</tspan>.</text>

  <rect x="736" y="410" width="408" height="82" rx="12" fill="#EFF9F4" stroke="#00C87A" stroke-width="2"/>
  <text x="760" y="440" fill="#0B1F3A" font-size="16" font-weight="800">The gate screen commits more</text>
  <text x="760" y="466" fill="#374151" font-size="14.5">The board announces. The gate screen</text>
  <text x="760" y="486" fill="#374151" font-size="14.5">sometimes shows the <tspan font-weight="800">reason</tspan>. Take both.</text>

  <rect x="56" y="514" width="1088" height="66" rx="12" fill="#0B1F3A"/>
  <text x="88" y="544" fill="#F0645A" font-size="16" font-weight="800">The number one mistake</text>
  <text x="88" y="568" fill="rgba(255,255,255,.92)" font-size="15">A photo with no clock proves nothing. And do not send your shots over messaging apps: compression wipes the date hidden in the file.</text>

  <text x="56" y="608" fill="#8C99AC" font-size="12.5">Fictional examples. Colour codes vary by airport, but delayed is almost always amber and cancelled red.</text>
</svg>
