<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Which evidence proves what</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">A strong claim never rests on a single document.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <text x="56" y="128" fill="#8C99AC" font-size="13" font-weight="800" letter-spacing="1.4">WHAT YOU MUST PROVE</text>
  <text x="474" y="128" fill="#8C99AC" font-size="13" font-weight="800" letter-spacing="1.4">WITH WHAT</text>

  <rect x="56" y="146" width="1088" height="92" rx="12" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="56" y="146" width="6" height="92" rx="3" fill="#00C87A"/>
  <text x="86" y="182" fill="#0B1F3A" font-size="18" font-weight="800">1 · I was on that flight</text>
  <text x="86" y="212" fill="#62718A" font-size="14">the link between you and the aircraft</text>
  <text x="474" y="180" fill="#374151" font-size="15"><tspan font-weight="800" fill="#0B1F3A">Boarding pass</tspan> for the original and the replacement flight</text>
  <text x="474" y="212" fill="#374151" font-size="15">Failing that: <tspan font-weight="800" fill="#047857">the bag tag</tspan> — name, flight number, date, routing</text>

  <rect x="56" y="250" width="1088" height="92" rx="12" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="56" y="250" width="6" height="92" rx="3" fill="#00C87A"/>
  <text x="86" y="286" fill="#0B1F3A" font-size="18" font-weight="800">2 · The flight really was disrupted</text>
  <text x="86" y="316" fill="#62718A" font-size="14">and what the airline said at the time</text>
  <text x="474" y="284" fill="#374151" font-size="15"><tspan font-weight="800" fill="#0B1F3A">Screenshots</tspan> of the alerts you received: SMS, email, app</text>
  <text x="474" y="316" fill="#374151" font-size="15"><tspan font-weight="800" fill="#0B1F3A">Posts</tspan> by the airline or the airport, on the day</text>

  <rect x="56" y="354" width="1088" height="92" rx="12" fill="#EFF9F4" stroke="#00C87A" stroke-width="2"/>
  <rect x="56" y="354" width="6" height="92" rx="3" fill="#047857"/>
  <text x="86" y="390" fill="#0B1F3A" font-size="18" font-weight="800">3 · The actual arrival time</text>
  <text x="86" y="420" fill="#047857" font-size="14" font-weight="700">this is what decides the 3-hour threshold</text>
  <text x="474" y="388" fill="#374151" font-size="15"><tspan font-weight="800" fill="#0B1F3A">Flight history</tspan> on trackers, with actual times</text>
  <text x="474" y="420" fill="#374151" font-size="15">And above all <tspan font-weight="800" fill="#047857">the door-opening time</tspan>, not touchdown</text>

  <rect x="56" y="458" width="1088" height="92" rx="12" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="56" y="458" width="6" height="92" rx="3" fill="#00C87A"/>
  <text x="86" y="494" fill="#0B1F3A" font-size="18" font-weight="800">4 · Weather does not excuse everything</text>
  <text x="86" y="524" fill="#62718A" font-size="14">if the airline blames the conditions</text>
  <text x="474" y="492" fill="#374151" font-size="15"><tspan font-weight="800" fill="#0B1F3A">Official weather reports</tspan> for the airport, at the time of the flight</text>
  <text x="474" y="524" fill="#374151" font-size="15">They show whether other flights departed normally that day</text>

  <text x="56" y="586" fill="#8C99AC" font-size="13.5">Statements from fellow passengers are supporting evidence only. They are never enough on their own.</text>
  <text x="56" y="610" fill="#8C99AC" font-size="13.5">Photograph the bag tag before peeling it off: it is the piece everyone throws away without thinking.</text>
</svg>
