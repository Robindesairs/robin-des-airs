<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Anatomie d'un retard : avez-vous droit à une indemnité ?</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">La règle des 14 jours du règlement CE 261</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- Carte gauche : pas d'indemnité -->
  <rect x="56" y="122" width="516" height="330" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="314" y="164" fill="#0B1F3A" font-size="20" font-weight="900" text-anchor="middle">ANNULATION PRÉVENUE</text>
  <text x="314" y="188" fill="#0B1F3A" font-size="20" font-weight="900" text-anchor="middle">PLUS DE 14 JOURS AVANT</text>

  <rect x="84" y="210" width="460" height="48" rx="10" fill="#F3F4F6"/>
  <text x="314" y="239" fill="#374151" font-size="15" font-weight="700" text-anchor="middle">Vous êtes prévenu tôt (route, planning)</text>
  <rect x="84" y="268" width="460" height="48" rx="10" fill="#F3F4F6"/>
  <text x="314" y="297" fill="#374151" font-size="15" font-weight="700" text-anchor="middle">Raison opérationnelle ou commerciale</text>

  <rect x="134" y="380" width="360" height="46" rx="23" fill="#EDF0F5"/>
  <text x="314" y="409" fill="#3C4A5C" font-size="16" font-weight="900" text-anchor="middle">PAS D'INDEMNITÉ</text>

  <!-- Carte droite : indemnité -->
  <rect x="628" y="122" width="516" height="330" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="886" y="164" fill="#047857" font-size="20" font-weight="900" text-anchor="middle">RETARD DE 3H ET PLUS,</text>
  <text x="886" y="188" fill="#047857" font-size="20" font-weight="900" text-anchor="middle">OU ANNULATION MOINS DE 14 JOURS</text>

  <rect x="656" y="210" width="460" height="48" rx="10" fill="#FFFFFF"/>
  <text x="886" y="239" fill="#0B1F3A" font-size="15" font-weight="800" text-anchor="middle">Panne technique, heures équipage, rotation</text>
  <rect x="656" y="268" width="460" height="48" rx="10" fill="#FFFFFF"/>
  <text x="886" y="297" fill="#0B1F3A" font-size="15" font-weight="800" text-anchor="middle">Causes à la charge de la compagnie</text>

  <rect x="686" y="380" width="400" height="46" rx="23" fill="#00C87A"/>
  <text x="886" y="409" fill="#04372A" font-size="16" font-weight="900" text-anchor="middle">INDEMNITÉ 250 À 600 €</text>

  <!-- Bas : exception -->
  <rect x="56" y="470" width="1088" height="72" rx="12" fill="#0B1F3A"/>
  <text x="88" y="500" fill="#FFFFFF" font-size="15.5" font-weight="800">Seule vraie exception : une cause extérieure à la compagnie.</text>
  <text x="88" y="524" fill="rgba(255,255,255,.92)" font-size="14.5">Météo extrême ou grève des contrôleurs aériens = circonstance extraordinaire, aucune indemnité due.</text>

  <text x="56" y="566" fill="#8C99AC" font-size="11.5">Règlement (CE) 261/2004, articles 5 et 7. La grève du personnel de la compagnie n'est pas une circonstance extraordinaire (CJUE).</text>
</svg>
