<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">L'oiseau n'explique pas tout le retard</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Seule la part réellement causée par l'événement se retranche. Le reste compte pour le seuil.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- retard total -->
  <text x="56" y="140" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">LE RETARD ANNONCÉ</text>
  <rect x="56" y="154" width="1088" height="54" rx="9" fill="#D7DDE7"/>
  <text x="600" y="188" fill="#3C4A5C" font-size="19" font-weight="800" text-anchor="middle">4 heures de retard à l'arrivée</text>

  <path d="M600 214 L600 240" stroke="#9AA8BC" stroke-width="2.5"/>
  <polygon points="600,248 594,236 606,236" fill="#9AA8BC"/>

  <!-- decomposition -->
  <text x="56" y="284" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">CE QUI L'A RÉELLEMENT CAUSÉ</text>

  <rect x="56" y="298" width="264" height="96" rx="9" fill="#FFFFFF" stroke="#9AA8BC" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="188" y="330" fill="#3C4A5C" font-size="15" font-weight="800" text-anchor="middle">1 h</text>
  <text x="188" y="353" fill="#62718A" font-size="13.5" text-anchor="middle">inspection après</text>
  <text x="188" y="371" fill="#62718A" font-size="13.5" text-anchor="middle">la collision aviaire</text>
  <rect x="88" y="378" width="200" height="0" fill="none"/>

  <rect x="336" y="298" width="808" height="96" rx="9" fill="#FBEBE8" stroke="#C4533F" stroke-width="3"/>
  <text x="740" y="330" fill="#8A3A2E" font-size="15" font-weight="800" text-anchor="middle">3 h</text>
  <text x="740" y="353" fill="#8A3A2E" font-size="13.5" text-anchor="middle">attente du technicien habilité venu d'ailleurs, ou de la pièce</text>
  <text x="740" y="371" fill="#8A3A2E" font-size="13.5" text-anchor="middle">arrivée par un autre vol : moyens présents sur l'escale</text>

  <text x="188" y="418" fill="#62718A" font-size="13" font-weight="800" text-anchor="middle">CIRCONSTANCE EXTRAORDINAIRE</text>
  <text x="188" y="437" fill="#8C99AC" font-size="12.5" text-anchor="middle">se retranche</text>
  <text x="740" y="418" fill="#B04A3C" font-size="13" font-weight="800" text-anchor="middle">ORGANISATION DE LA COMPAGNIE</text>
  <text x="740" y="437" fill="#B04A3C" font-size="12.5" text-anchor="middle">ne se retranche pas</text>

  <!-- verdict -->
  <rect x="56" y="466" width="1088" height="78" rx="12" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="88" y="498" fill="#0B1F3A" font-size="17" font-weight="800">Il reste 3 heures de retard ordinaire. Le seuil est atteint, l'indemnisation est due.</text>
  <text x="88" y="525" fill="#374151" font-size="14.5">Et si la compagnie ne produit aucune chronologie horodatée, <tspan font-weight="800" fill="#047857">rien n'est retranché</tspan> : les 4 heures comptent en entier.</text>

  <text x="56" y="578" fill="#8C99AC" font-size="12.5">Fondement : CJUE, Pešková et Peška, 4 mai 2017, affaire C-315/15. Le retard imputable à la circonstance extraordinaire doit être « retranché » du retard total.</text>
  <text x="56" y="602" fill="#8C99AC" font-size="12.5">Durées données à titre d'illustration. La charge de la preuve pèse entièrement sur le transporteur.</text>
</svg>
