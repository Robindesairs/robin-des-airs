<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">« C'est la météo » ? Regardez les autres vols</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Un seul vol retardé quand les autres partent : la piste de départ fonctionnait. Reste l'arrivée.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <text x="56" y="138" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">TABLEAU DES DÉPARTS, MÊME AÉROPORT, MÊME HEURE</text>

  <!-- header row -->
  <rect x="56" y="150" width="1088" height="40" rx="8" fill="#0B1F3A"/>
  <text x="80" y="176" fill="#FFFFFF" font-size="14" font-weight="800">HEURE</text>
  <text x="230" y="176" fill="#FFFFFF" font-size="14" font-weight="800">VOL</text>
  <text x="400" y="176" fill="#FFFFFF" font-size="14" font-weight="800">DESTINATION</text>
  <text x="1120" y="176" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="end">STATUT</text>

  <!-- rows on time -->
  <g font-size="16">
    <rect x="56" y="196" width="1088" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="225" fill="#3C4A5C" font-weight="700">18:05</text>
    <text x="230" y="225" fill="#3C4A5C" font-weight="700">TO 2431</text>
    <text x="400" y="225" fill="#3C4A5C">Marseille</text>
    <rect x="1000" y="207" width="120" height="26" rx="13" fill="#E4F5EE"/>
    <text x="1060" y="225" fill="#047857" font-size="13.5" font-weight="800" text-anchor="middle">À l'heure</text>

    <rect x="56" y="248" width="1088" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="277" fill="#3C4A5C" font-weight="700">18:20</text>
    <text x="230" y="277" fill="#3C4A5C" font-weight="700">AF 1178</text>
    <text x="400" y="277" fill="#3C4A5C">Alger</text>
    <rect x="1000" y="259" width="120" height="26" rx="13" fill="#E4F5EE"/>
    <text x="1060" y="277" fill="#047857" font-size="13.5" font-weight="800" text-anchor="middle">À l'heure</text>

    <!-- delayed row highlighted -->
    <rect x="56" y="300" width="1088" height="46" rx="8" fill="#FBEBE8" stroke="#C4533F" stroke-width="3"/>
    <text x="80" y="329" fill="#8A3A2E" font-weight="800">18:30</text>
    <text x="230" y="329" fill="#8A3A2E" font-weight="800">XY 447</text>
    <text x="400" y="329" fill="#8A3A2E" font-weight="700">Dakar</text>
    <rect x="990" y="311" width="130" height="26" rx="13" fill="#C4533F"/>
    <text x="1055" y="329" fill="#FFFFFF" font-size="13.5" font-weight="800" text-anchor="middle">Retard 3h20</text>
    <text x="470" y="329" fill="#8A3A2E" font-size="13" font-weight="700">← votre vol</text>

    <rect x="56" y="352" width="1088" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="381" fill="#3C4A5C" font-weight="700">18:40</text>
    <text x="230" y="381" fill="#3C4A5C" font-weight="700">U2 6602</text>
    <text x="400" y="381" fill="#3C4A5C">Lisbonne</text>
    <rect x="1000" y="363" width="120" height="26" rx="13" fill="#E4F5EE"/>
    <text x="1060" y="381" fill="#047857" font-size="13.5" font-weight="800" text-anchor="middle">À l'heure</text>

    <rect x="56" y="404" width="1088" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="433" fill="#3C4A5C" font-weight="700">18:55</text>
    <text x="230" y="433" fill="#3C4A5C" font-weight="700">AT 784</text>
    <text x="400" y="433" fill="#3C4A5C">Casablanca</text>
    <rect x="1000" y="415" width="120" height="26" rx="13" fill="#E4F5EE"/>
    <text x="1060" y="433" fill="#047857" font-size="13.5" font-weight="800" text-anchor="middle">À l'heure</text>

    <rect x="56" y="456" width="1088" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="485" fill="#3C4A5C" font-weight="700">19:10</text>
    <text x="230" y="485" fill="#3C4A5C" font-weight="700">SN 3812</text>
    <text x="400" y="485" fill="#3C4A5C">Abidjan</text>
    <rect x="1000" y="467" width="120" height="26" rx="13" fill="#E4F5EE"/>
    <text x="1060" y="485" fill="#047857" font-size="13.5" font-weight="800" text-anchor="middle">À l'heure</text>
  </g>

  <!-- conclusion -->
  <rect x="56" y="526" width="1088" height="72" rx="10" fill="#0B1F3A"/>
  <text x="600" y="558" fill="#FFFFFF" font-size="17" font-weight="800" text-anchor="middle">Départ dégagé ne veut pas dire arrivée dégagée. On vérifie les deux bouts.</text>
  <text x="600" y="582" fill="#00E5A0" font-size="14.5" font-weight="600" text-anchor="middle">C'est l'addition de toutes les conditions, jamais un seul signal, qui tranche.</text>
</svg>
