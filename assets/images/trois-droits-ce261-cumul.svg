<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Trois droits différents, et ils s'additionnent</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Un bon repas ne solde ni votre indemnité, ni l'obligation de vous ramener à destination.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- ARTICLE 9 -->
  <rect x="56" y="126" width="342" height="330" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <rect x="56" y="126" width="342" height="52" rx="14" fill="#00C87A"/>
  <rect x="56" y="164" width="342" height="14" fill="#00C87A"/>
  <text x="227" y="159" fill="#04372A" font-size="19" font-weight="900" text-anchor="middle">ARTICLE 9</text>
  <text x="227" y="204" fill="#0B1F3A" font-size="16" font-weight="800" text-anchor="middle">Repas, hôtel, transport</text>
  <text x="227" y="226" fill="#0B1F3A" font-size="16" font-weight="800" text-anchor="middle">et 2 communications</text>

  <rect x="80" y="248" width="294" height="46" rx="10" fill="#FFFFFF"/>
  <text x="227" y="268" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">QUELLE QUE SOIT LA CAUSE</text>
  <text x="227" y="286" fill="#374151" font-size="12.5" text-anchor="middle">météo, grève, cendres : aucune importance</text>

  <text x="80" y="322" fill="#374151" font-size="14">Se déclenche selon la distance :</text>
  <text x="80" y="346" fill="#0B1F3A" font-size="14" font-weight="700">2 h · 3 h · 4 h d'attente</text>
  <text x="80" y="368" fill="#8C99AC" font-size="13">compté sur le retard au départ</text>

  <rect x="80" y="386" width="294" height="50" rx="10" fill="#0B1F3A"/>
  <text x="227" y="406" fill="#00E5A0" font-size="13" font-weight="800" text-anchor="middle">NE TOMBE JAMAIS</text>
  <text x="227" y="425" fill="rgba(255,255,255,.9)" font-size="12.5" text-anchor="middle">c'est le seul droit dans ce cas</text>

  <!-- ARTICLE 7 -->
  <rect x="429" y="126" width="342" height="330" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="429" y="126" width="342" height="52" rx="14" fill="#0B1F3A"/>
  <rect x="429" y="164" width="342" height="14" fill="#0B1F3A"/>
  <text x="600" y="159" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">ARTICLE 7</text>
  <text x="600" y="204" fill="#0B1F3A" font-size="16" font-weight="800" text-anchor="middle">Indemnité forfaitaire</text>
  <text x="600" y="232" fill="#0B1F3A" font-size="22" font-weight="900" text-anchor="middle">250 · 400 · 600 €</text>

  <rect x="453" y="252" width="294" height="46" rx="10" fill="#FBEBE8"/>
  <text x="600" y="272" fill="#B04A3C" font-size="13" font-weight="800" text-anchor="middle">TOMBE SI CIRCONSTANCE</text>
  <text x="600" y="290" fill="#B04A3C" font-size="13" font-weight="800" text-anchor="middle">EXTRAORDINAIRE PROUVÉE</text>

  <text x="453" y="326" fill="#374151" font-size="14">Se déclenche à partir de :</text>
  <text x="453" y="350" fill="#0B1F3A" font-size="14" font-weight="700">3 h de retard</text>
  <text x="453" y="372" fill="#8C99AC" font-size="13">compté à l'arrivée, porte ouverte</text>

  <text x="453" y="410" fill="#62718A" font-size="13">La compagnie doit alors prouver</text>
  <text x="453" y="430" fill="#62718A" font-size="13">trois choses pour ne rien verser.</text>

  <!-- ARTICLE 8 -->
  <rect x="802" y="126" width="342" height="330" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="802" y="126" width="342" height="52" rx="14" fill="#0B1F3A"/>
  <rect x="802" y="164" width="342" height="14" fill="#0B1F3A"/>
  <text x="973" y="159" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">ARTICLE 8</text>
  <text x="973" y="204" fill="#0B1F3A" font-size="16" font-weight="800" text-anchor="middle">Réacheminement</text>
  <text x="973" y="226" fill="#0B1F3A" font-size="16" font-weight="800" text-anchor="middle">ou remboursement</text>

  <rect x="826" y="248" width="294" height="46" rx="10" fill="#EDF0F5"/>
  <text x="973" y="268" fill="#3C4A5C" font-size="13" font-weight="800" text-anchor="middle">AU CHOIX DU PASSAGER</text>
  <text x="973" y="286" fill="#62718A" font-size="12.5" text-anchor="middle">selon la situation</text>

  <text x="826" y="322" fill="#374151" font-size="14">Vous ramener à destination,</text>
  <text x="826" y="344" fill="#374151" font-size="14">ou vous rembourser le billet.</text>

  <text x="826" y="382" fill="#62718A" font-size="13">Vous proposer le vol du lendemain</text>
  <text x="826" y="402" fill="#62718A" font-size="13">ne suffit pas : elle doit chercher</text>
  <text x="826" y="422" fill="#62718A" font-size="13">ailleurs, y compris chez un concurrent.</text>

  <!-- addition -->
  <text x="413" y="303" fill="#8C99AC" font-size="30" font-weight="300" text-anchor="middle">+</text>
  <text x="786" y="303" fill="#8C99AC" font-size="30" font-weight="300" text-anchor="middle">+</text>

  <rect x="56" y="482" width="1088" height="62" rx="12" fill="#0B1F3A"/>
  <text x="88" y="509" fill="#FFFFFF" font-size="16" font-weight="800">L'erreur la plus coûteuse : croire qu'un bon repas règle l'affaire.</text>
  <text x="88" y="532" fill="rgba(255,255,255,.9)" font-size="14.5">Une compagnie qui vous a nourri ne vous a versé aucune indemnité, et ne vous a pas encore ramené chez vous.</text>

  <text x="56" y="578" fill="#8C99AC" font-size="12">Règlement CE 261/2004, articles 7, 8 et 9. Sur l'absence de plafond de l'assistance : CJUE, McDonagh, 31 janvier 2013, affaire C-12/11.</text>
  <text x="56" y="600" fill="#8C99AC" font-size="12">Le règlement s'applique au départ de l'Union quelle que soit la compagnie, et vers l'Union seulement si le transporteur est européen.</text>
</svg>
