<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">La journée d'un avion, et votre retard du soir</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Le même appareil enchaîne 4 à 6 vols. Le retard ne se dilue pas, il s'accumule.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <text x="56" y="132" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">HORAIRE PRÉVU</text>
  <text x="56" y="286" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">CE QUI SE PASSE VRAIMENT</text>

  <!-- ===== ligne prevue ===== -->
  <g>
    <rect x="56" y="148" width="150" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDE7" stroke-width="2"/>
    <text x="131" y="169" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 1</text>
    <text x="131" y="186" fill="#8C99AC" font-size="12" text-anchor="middle">06:20</text>

    <rect x="274" y="148" width="150" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDE7" stroke-width="2"/>
    <text x="349" y="169" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 2</text>
    <text x="349" y="186" fill="#8C99AC" font-size="12" text-anchor="middle">09:45</text>

    <rect x="492" y="148" width="150" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDE7" stroke-width="2"/>
    <text x="567" y="169" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 3</text>
    <text x="567" y="186" fill="#8C99AC" font-size="12" text-anchor="middle">13:10</text>

    <rect x="710" y="148" width="150" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDE7" stroke-width="2"/>
    <text x="785" y="169" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 4</text>
    <text x="785" y="186" fill="#8C99AC" font-size="12" text-anchor="middle">16:35</text>

    <rect x="928" y="148" width="176" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDE7" stroke-width="2"/>
    <text x="1016" y="169" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 5</text>
    <text x="1016" y="186" fill="#8C99AC" font-size="12" text-anchor="middle">20:05</text>
  </g>

  <!-- fleches de rotation -->
  <g stroke="#C9D2DE" stroke-width="2" fill="none">
    <path d="M206 171 L274 171"/><path d="M424 171 L492 171"/>
    <path d="M642 171 L710 171"/><path d="M860 171 L928 171"/>
  </g>
  <g fill="#C9D2DE">
    <polygon points="274,171 266,167 266,175"/><polygon points="492,171 484,167 484,175"/>
    <polygon points="710,171 702,167 702,175"/><polygon points="928,171 920,167 920,175"/>
  </g>
  <text x="240" y="216" fill="#A8B3C4" font-size="11.5" text-anchor="middle">escale</text>
  <text x="458" y="216" fill="#A8B3C4" font-size="11.5" text-anchor="middle">escale</text>
  <text x="676" y="216" fill="#A8B3C4" font-size="11.5" text-anchor="middle">escale</text>
  <text x="894" y="216" fill="#A8B3C4" font-size="11.5" text-anchor="middle">escale</text>

  <line x1="56" y1="244" x2="1144" y2="244" stroke="#E2E6EE" stroke-width="2"/>

  <!-- ===== ligne reelle ===== -->
  <g>
    <rect x="56" y="302" width="150" height="58" rx="7" fill="#FFF8EC" stroke="#E8A020" stroke-width="2"/>
    <text x="131" y="323" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 1</text>
    <text x="131" y="341" fill="#8A6520" font-size="12" text-anchor="middle">06:40</text>
    <text x="131" y="355" fill="#B0791F" font-size="12" font-weight="800" text-anchor="middle">+ 20 min</text>

    <rect x="274" y="302" width="150" height="58" rx="7" fill="#FFF8EC" stroke="#E8A020" stroke-width="2"/>
    <text x="349" y="323" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 2</text>
    <text x="349" y="341" fill="#8A6520" font-size="12" text-anchor="middle">10:20</text>
    <text x="349" y="355" fill="#B0791F" font-size="12" font-weight="800" text-anchor="middle">+ 35 min</text>

    <rect x="492" y="302" width="150" height="58" rx="7" fill="#FDF1EC" stroke="#D9772F" stroke-width="2"/>
    <text x="567" y="323" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 3</text>
    <text x="567" y="341" fill="#8A4A20" font-size="12" text-anchor="middle">14:05</text>
    <text x="567" y="355" fill="#B0551F" font-size="12" font-weight="800" text-anchor="middle">+ 55 min</text>

    <rect x="710" y="302" width="150" height="58" rx="7" fill="#FBEBE8" stroke="#C4533F" stroke-width="2"/>
    <text x="785" y="323" fill="#0B1F3A" font-size="13.5" font-weight="700" text-anchor="middle">Vol 4</text>
    <text x="785" y="341" fill="#8A3A2E" font-size="12" text-anchor="middle">18:00</text>
    <text x="785" y="355" fill="#B04A3C" font-size="12" font-weight="800" text-anchor="middle">+ 1 h 25</text>

    <rect x="920" y="294" width="192" height="74" rx="9" fill="#F0645A"/>
    <text x="1016" y="317" fill="#FFFFFF" font-size="13.5" font-weight="800" text-anchor="middle">Vol 5</text>
    <text x="1016" y="337" fill="rgba(255,255,255,.92)" font-size="12" text-anchor="middle">22:20</text>
    <text x="1016" y="358" fill="#FFFFFF" font-size="15" font-weight="900" text-anchor="middle">+ 2 h 15</text>
  </g>

  <g stroke="#E2B27A" stroke-width="2" fill="none">
    <path d="M206 331 L274 331"/><path d="M424 331 L492 331"/>
    <path d="M642 331 L710 331"/><path d="M860 331 L920 331"/>
  </g>
  <g fill="#E2B27A">
    <polygon points="274,331 266,327 266,335"/><polygon points="492,331 484,327 484,335"/>
    <polygon points="710,331 702,327 702,335"/><polygon points="920,331 912,327 912,335"/>
  </g>

  <text x="1016" y="394" fill="#B04A3C" font-size="14.5" font-weight="800" text-anchor="middle">votre vol</text>
  <path d="M1016 402 L1016 414" stroke="#B04A3C" stroke-width="2.5"/>
  <polygon points="1016,420 1011,410 1021,410" fill="#B04A3C"/>

  <!-- ===== encadres du bas ===== -->
  <rect x="56" y="440" width="530" height="122" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="84" y="474" fill="#0B1F3A" font-size="17" font-weight="800">Pourquoi ça ne se rattrape pas</text>
  <text x="84" y="504" fill="#374151" font-size="14.5">Le temps au sol est calculé au plus juste : un avion</text>
  <text x="84" y="526" fill="#374151" font-size="14.5">immobilisé ne rapporte rien. Il n'existe presque</text>
  <text x="84" y="548" fill="#374151" font-size="14.5">aucune marge pour absorber le retard de la veille.</text>

  <rect x="614" y="440" width="530" height="122" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="642" y="474" fill="#0B1F3A" font-size="17" font-weight="800">Ce que ça change pour vous</text>
  <text x="642" y="504" fill="#374151" font-size="14.5">Le retard de votre vol du soir s'est peut-être formé</text>
  <text x="642" y="526" fill="#374151" font-size="14.5">à l'aube, sur un vol que vous n'avez jamais pris.</text>
  <text x="642" y="548" fill="#047857" font-size="14.5" font-weight="800">Ce motif reste indemnisable.</text>

  <text x="56" y="600" fill="#8C99AC" font-size="12">Horaires donnés à titre d'illustration. Source du constat : EUROCONTROL, le retard réactionnaire est la première cause de retard en Europe.</text>
</svg>
