<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Ce qu'il faut photographier à l'aéroport</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Sans l'heure dans le cadre, la photo ne prouve rien.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <text x="56" y="128" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">1 · LE TABLEAU DES DÉPARTS</text>

  <rect x="56" y="142" width="640" height="250" rx="10" fill="#0A1420"/>
  <rect x="56" y="142" width="640" height="38" rx="10" fill="#16233A"/>
  <rect x="56" y="168" width="640" height="12" fill="#16233A"/>
  <text x="76" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">HEURE</text>
  <text x="168" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">VOL</text>
  <text x="268" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">DESTINATION</text>
  <text x="462" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">PORTE</text>
  <text x="540" y="167" fill="#8FA3BF" font-size="13" font-weight="700" letter-spacing=".6">STATUT</text>

  <text x="76" y="212" fill="#E8EEF7" font-size="17" font-weight="700">19:40</text>
  <text x="168" y="212" fill="#E8EEF7" font-size="17" font-weight="700">AF 718</text>
  <text x="268" y="212" fill="#E8EEF7" font-size="17">ABIDJAN</text>
  <text x="462" y="212" fill="#E8EEF7" font-size="17">K 42</text>
  <text x="540" y="212" fill="#3DDC97" font-size="17" font-weight="700">À L'HEURE</text>

  <rect x="64" y="228" width="624" height="46" rx="7" fill="#2A2010" stroke="#E8A020" stroke-width="2"/>
  <text x="76" y="258" fill="#FFFFFF" font-size="17" font-weight="700">20:15</text>
  <text x="168" y="258" fill="#FFFFFF" font-size="17" font-weight="800">SN 281</text>
  <text x="268" y="258" fill="#FFFFFF" font-size="17" font-weight="700">KINSHASA</text>
  <text x="462" y="258" fill="#FFFFFF" font-size="17">B 38</text>
  <text x="540" y="252" fill="#F5B33C" font-size="16" font-weight="800">RETARDÉ</text>
  <text x="540" y="270" fill="#F5B33C" font-size="14" font-weight="700">nouvelle h. 23:05</text>

  <text x="76" y="304" fill="#E8EEF7" font-size="17" font-weight="700">20:55</text>
  <text x="168" y="304" fill="#E8EEF7" font-size="17" font-weight="700">AT 785</text>
  <text x="268" y="304" fill="#E8EEF7" font-size="17">CASABLANCA</text>
  <text x="462" y="304" fill="#E8EEF7" font-size="17">—</text>
  <text x="540" y="304" fill="#F0645A" font-size="17" font-weight="800">ANNULÉ</text>

  <text x="76" y="346" fill="#E8EEF7" font-size="17" font-weight="700">21:30</text>
  <text x="168" y="346" fill="#E8EEF7" font-size="17" font-weight="700">TP 1455</text>
  <text x="268" y="346" fill="#E8EEF7" font-size="17">LISBONNE</text>
  <text x="462" y="346" fill="#E8EEF7" font-size="17">C 12</text>
  <text x="540" y="346" fill="#3DDC97" font-size="17" font-weight="700">EMBARQUEMENT</text>

  <rect x="452" y="356" width="236" height="28" rx="14" fill="#16233A"/>
  <text x="470" y="375" fill="#5C6E88" font-size="12" font-weight="700" letter-spacing=".4">HEURE ÉCRAN</text>
  <text x="672" y="376" fill="#8FA3BF" font-size="15" font-weight="800" text-anchor="end">20:47</text>

  <text x="736" y="128" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">2 · L'ÉCRAN DE LA PORTE</text>
  <rect x="736" y="142" width="408" height="250" rx="10" fill="#0A1420"/>
  <text x="940" y="196" fill="#8FA3BF" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">PORTE B 38</text>
  <text x="940" y="240" fill="#FFFFFF" font-size="30" font-weight="800" text-anchor="middle">SN 281</text>
  <text x="940" y="272" fill="#E8EEF7" font-size="20" text-anchor="middle">KINSHASA</text>
  <rect x="796" y="292" width="288" height="40" rx="20" fill="#E8A020"/>
  <text x="940" y="319" fill="#241A05" font-size="17" font-weight="800" text-anchor="middle">RETARDÉ · 23:05</text>
  <text x="940" y="356" fill="#F5B33C" font-size="15" font-weight="700" text-anchor="middle">Incident technique</text>
  <text x="940" y="378" fill="#5C6E88" font-size="13" text-anchor="middle">le motif apparaît parfois ici</text>

  <rect x="56" y="410" width="640" height="82" rx="12" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="80" y="440" fill="#0B1F3A" font-size="16" font-weight="800">À cadrer sur la photo</text>
  <text x="80" y="466" fill="#374151" font-size="14.5">Le numéro de vol, la destination, l'heure prévue, le statut,</text>
  <text x="80" y="486" fill="#374151" font-size="14.5">la nouvelle heure annoncée, et <tspan font-weight="800" fill="#047857">l'horloge de l'écran</tspan>.</text>

  <rect x="736" y="410" width="408" height="82" rx="12" fill="#EFF9F4" stroke="#00C87A" stroke-width="2"/>
  <text x="760" y="440" fill="#0B1F3A" font-size="16" font-weight="800">L'écran de porte engage plus</text>
  <text x="760" y="466" fill="#374151" font-size="14.5">Le tableau annonce. La porte, elle,</text>
  <text x="760" y="486" fill="#374151" font-size="14.5">affiche parfois le <tspan font-weight="800">motif</tspan>. Prenez les deux.</text>

  <rect x="56" y="514" width="1088" height="66" rx="12" fill="#0B1F3A"/>
  <text x="88" y="544" fill="#F0645A" font-size="16" font-weight="800">L'erreur numéro un</text>
  <text x="88" y="568" fill="rgba(255,255,255,.92)" font-size="15">Une photo sans horloge ne prouve rien. Et n'envoyez pas vos clichés par messagerie : la compression efface la date cachée dans le fichier.</text>

  <text x="56" y="608" fill="#8C99AC" font-size="12.5">Exemples fictifs. Les codes couleur varient selon les aéroports, mais le retardé est presque toujours en ambre et l'annulé en rouge.</text>
</svg>
