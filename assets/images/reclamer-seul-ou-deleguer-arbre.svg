<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Faut-il le faire soi-même ? Une seule question</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">La compagnie a-t-elle une cause à vous opposer, oui ou non ?</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- question -->
  <rect x="330" y="122" width="540" height="58" rx="12" fill="#0B1F3A"/>
  <text x="600" y="158" fill="#FFFFFF" font-size="17" font-weight="800" text-anchor="middle">Pourquoi votre vol a-t-il été perturbé ?</text>

  <path d="M600 180 L600 200 M330 200 L870 200 M330 200 L330 222 M870 200 L870 222" stroke="#9AA8BC" stroke-width="2.5" fill="none"/>
  <polygon points="330,230 324,218 336,218" fill="#9AA8BC"/>
  <polygon points="870,230 864,218 876,218" fill="#9AA8BC"/>

  <!-- branche gauche : surbooking -->
  <rect x="56" y="234" width="548" height="252" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="330" y="268" fill="#047857" font-size="19" font-weight="900" text-anchor="middle">REFUS D'EMBARQUEMENT</text>
  <text x="330" y="292" fill="#0B1F3A" font-size="15" font-weight="700" text-anchor="middle">Vous étiez à l'heure, on ne vous a pas laissé monter.</text>

  <rect x="88" y="310" width="484" height="52" rx="10" fill="#FFFFFF"/>
  <text x="330" y="332" fill="#0B1F3A" font-size="15" font-weight="800" text-anchor="middle">C'est binaire : soit vous avez embarqué, soit non.</text>
  <text x="330" y="352" fill="#62718A" font-size="14" text-anchor="middle">Aucune circonstance extraordinaire à discuter.</text>

  <text x="330" y="392" fill="#374151" font-size="15" text-anchor="middle">Le dossier tient en un courrier.</text>
  <text x="330" y="414" fill="#374151" font-size="15" text-anchor="middle">La compagnie a très peu de matière pour contester.</text>

  <rect x="150" y="434" width="360" height="38" rx="19" fill="#00C87A"/>
  <text x="330" y="459" fill="#04372A" font-size="16" font-weight="900" text-anchor="middle">FAITES-LE VOUS-MÊME</text>

  <!-- branche droite : le reste -->
  <rect x="628" y="234" width="516" height="252" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="886" y="268" fill="#0B1F3A" font-size="19" font-weight="900" text-anchor="middle">RETARD, ANNULATION,</text>
  <text x="886" y="290" fill="#0B1F3A" font-size="19" font-weight="900" text-anchor="middle">CORRESPONDANCE</text>

  <rect x="660" y="306" width="452" height="52" rx="10" fill="#FBEBE8"/>
  <text x="886" y="328" fill="#8A3A2E" font-size="14.5" font-weight="800" text-anchor="middle">La compagnie peut invoquer</text>
  <text x="886" y="348" fill="#8A3A2E" font-size="14.5" font-weight="800" text-anchor="middle">une circonstance extraordinaire.</text>

  <text x="886" y="384" fill="#374151" font-size="14.5" text-anchor="middle">Il faudra recouper sa version, relancer,</text>
  <text x="886" y="405" fill="#374151" font-size="14.5" text-anchor="middle">puis parfois saisir un tribunal.</text>

  <rect x="700" y="426" width="372" height="46" rx="10" fill="#EDF0F5"/>
  <text x="886" y="446" fill="#3C4A5C" font-size="14.5" font-weight="800" text-anchor="middle">Irez-vous vraiment jusqu'au bout ?</text>
  <text x="886" y="464" fill="#62718A" font-size="13.5" text-anchor="middle">C'est la seule question qui décide.</text>

  <!-- bas -->
  <rect x="56" y="506" width="1088" height="72" rx="12" fill="#0B1F3A"/>
  <text x="88" y="534" fill="#FFFFFF" font-size="15.5" font-weight="800">68 % des passagers perturbés ne contactent même pas la compagnie.</text>
  <text x="88" y="558" fill="rgba(255,255,255,.92)" font-size="14.5">La raison la plus citée : penser qu'elle ne répondra pas correctement. Un dossier délégué vaut mieux qu'un dossier abandonné.</text>

  <text x="56" y="606" fill="#8C99AC" font-size="11.5">Source du chiffre : Cour des comptes européenne, rapport spécial n° 30/2018, enquête auprès de plus de 10 000 citoyens.</text>
</svg>
