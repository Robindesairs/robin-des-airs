<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">L'étiquette bagage : il y en a trois</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Celle que vous gardez n'est pas celle qui prouve votre vol.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- 1 : le recu -->
  <rect x="56" y="128" width="352" height="330" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="56" y="128" width="352" height="46" rx="14" fill="#EDF0F5"/>
  <rect x="56" y="160" width="352" height="14" fill="#EDF0F5"/>
  <text x="80" y="158" fill="#62718A" font-size="14" font-weight="800" letter-spacing="1.1">1 · LE REÇU</text>
  <text x="80" y="204" fill="#0B1F3A" font-size="17" font-weight="800">On vous le remet</text>
  <text x="80" y="228" fill="#62718A" font-size="14">souvent collé au dos de la</text>
  <text x="80" y="248" fill="#62718A" font-size="14">carte d'embarquement</text>
  <text x="80" y="288" fill="#62718A" font-size="13" font-weight="800" letter-spacing=".8">CE QU'IL PORTE</text>
  <text x="80" y="314" fill="#374151" font-size="15">✓ numéro à 10 chiffres</text>
  <text x="80" y="340" fill="#374151" font-size="15">✓ votre nom</text>
  <text x="80" y="366" fill="#374151" font-size="15">✓ la destination</text>
  <text x="80" y="392" fill="#B04A3C" font-size="15">✗ vol et date : pas toujours</text>
  <rect x="80" y="410" width="304" height="30" rx="15" fill="#F5EDEC"/>
  <text x="232" y="430" fill="#B04A3C" font-size="13.5" font-weight="700" text-anchor="middle">celui que vous gardez</text>

  <!-- 2 : la grande etiquette -->
  <rect x="424" y="128" width="352" height="330" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <rect x="424" y="128" width="352" height="46" rx="14" fill="#00C87A"/>
  <rect x="424" y="160" width="352" height="14" fill="#00C87A"/>
  <text x="448" y="158" fill="#04372A" font-size="14" font-weight="800" letter-spacing="1.1">2 · LA GRANDE ÉTIQUETTE</text>
  <text x="448" y="204" fill="#0B1F3A" font-size="17" font-weight="800">Enroulée sur la poignée</text>
  <text x="448" y="228" fill="#62718A" font-size="14">c'est celle qu'on arrache</text>
  <text x="448" y="248" fill="#62718A" font-size="14">et qu'on jette en sortant</text>
  <text x="448" y="288" fill="#62718A" font-size="13" font-weight="800" letter-spacing=".8">CE QU'ELLE PORTE</text>
  <text x="448" y="314" fill="#0B1F3A" font-size="15" font-weight="800">✓ le numéro de vol</text>
  <text x="448" y="340" fill="#0B1F3A" font-size="15" font-weight="800">✓ la date</text>
  <text x="448" y="366" fill="#0B1F3A" font-size="15" font-weight="800">✓ le trajet et les escales</text>
  <text x="448" y="392" fill="#374151" font-size="15">✓ nom, numéro, code-barres</text>
  <rect x="448" y="410" width="304" height="30" rx="15" fill="#00C87A"/>
  <text x="600" y="430" fill="#04372A" font-size="13.5" font-weight="800" text-anchor="middle">PHOTOGRAPHIEZ CELLE-CI</text>

  <!-- 3 : le bingo tag -->
  <rect x="792" y="128" width="352" height="330" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <rect x="792" y="128" width="352" height="46" rx="14" fill="#EDF0F5"/>
  <rect x="792" y="160" width="352" height="14" fill="#EDF0F5"/>
  <text x="816" y="158" fill="#62718A" font-size="14" font-weight="800" letter-spacing="1.1">3 · LA LANGUETTE</text>
  <text x="816" y="204" fill="#0B1F3A" font-size="17" font-weight="800">Collée sur la coque</text>
  <text x="816" y="228" fill="#62718A" font-size="14">à un autre endroit que la</text>
  <text x="816" y="248" fill="#62718A" font-size="14">poignée · dite « bingo tag »</text>
  <text x="816" y="288" fill="#62718A" font-size="13" font-weight="800" letter-spacing=".8">CE QU'ELLE PORTE</text>
  <text x="816" y="314" fill="#374151" font-size="15">✓ numéro à 10 chiffres</text>
  <text x="816" y="340" fill="#374151" font-size="15">✓ code-barres</text>
  <text x="816" y="366" fill="#B04A3C" font-size="15">✗ ni nom, ni vol, ni date</text>
  <text x="816" y="392" fill="#62718A" font-size="14">simple secours si l'étiquette</text>
  <text x="816" y="412" fill="#62718A" font-size="14">principale est arrachée</text>
  <rect x="816" y="424" width="304" height="16" rx="8" fill="#FFFFFF"/>

  <rect x="56" y="484" width="1088" height="96" rx="14" fill="#0B1F3A"/>
  <text x="88" y="518" fill="#00E5A0" font-size="17" font-weight="800">Ce que ça prouve, et ce que ça ne prouve pas</text>
  <text x="88" y="546" fill="rgba(255,255,255,.92)" font-size="15">Ces étiquettes établissent qu'un bagage a été enregistré à votre nom sur ce vol. Elles ne prouvent pas à elles</text>
  <text x="88" y="568" fill="rgba(255,255,255,.92)" font-size="15">seules que vous avez embarqué : joignez-les à votre réservation, pas à la place.</text>

  <text x="56" y="608" fill="#8C99AC" font-size="12.5">Le numéro à 10 chiffres suit la norme IATA (Résolutions 740 et 751) : 1 chiffre de type, 3 chiffres de compagnie, 6 chiffres de séquence.</text>
</svg>
