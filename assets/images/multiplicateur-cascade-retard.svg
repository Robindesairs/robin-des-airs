<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Un retard ne se dilue pas, il se multiplie</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Ce qu'un retard coûte vraiment, une fois compté ce qu'il propage au reste du réseau.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- axes -->
  <line x1="120" y1="452" x2="1108" y2="452" stroke="#C9D2DE" stroke-width="2.5"/>
  <line x1="120" y1="150" x2="120" y2="452" stroke="#C9D2DE" stroke-width="2.5"/>

  <!-- graduations -->
  <g stroke="#E8ECF2" stroke-width="1.5">
    <line x1="120" y1="412" x2="1108" y2="412"/>
    <line x1="120" y1="372" x2="1108" y2="372"/>
    <line x1="120" y1="332" x2="1108" y2="332"/>
    <line x1="120" y1="292" x2="1108" y2="292"/>
    <line x1="120" y1="252" x2="1108" y2="252"/>
    <line x1="120" y1="212" x2="1108" y2="212"/>
    <line x1="120" y1="172" x2="1108" y2="172"/>
  </g>
  <g fill="#8C99AC" font-size="12.5" text-anchor="end">
    <text x="106" y="457">×1</text>
    <text x="106" y="417">×2</text>
    <text x="106" y="377">×3</text>
    <text x="106" y="337">×4</text>
    <text x="106" y="297">×5</text>
    <text x="106" y="257">×6</text>
    <text x="106" y="217">×7</text>
  </g>

  <!-- barres : y = 452 - (mult-1)*40 -->
  <g>
    <rect x="176" y="431" width="128" height="21" rx="5" fill="#9AD9BC"/>
    <text x="240" y="421" fill="#0B1F3A" font-size="17" font-weight="800" text-anchor="middle">× 1,52</text>
    <text x="240" y="480" fill="#4A5A70" font-size="14.5" font-weight="700" text-anchor="middle">5 min</text>

    <rect x="360" y="413" width="128" height="39" rx="5" fill="#6FCBA4"/>
    <text x="424" y="403" fill="#0B1F3A" font-size="17" font-weight="800" text-anchor="middle">× 1,97</text>
    <text x="424" y="480" fill="#4A5A70" font-size="14.5" font-weight="700" text-anchor="middle">30 min</text>

    <rect x="544" y="392" width="128" height="60" rx="5" fill="#3FBC8C"/>
    <text x="608" y="382" fill="#0B1F3A" font-size="17" font-weight="800" text-anchor="middle">× 2,51</text>
    <text x="608" y="480" fill="#4A5A70" font-size="14.5" font-weight="700" text-anchor="middle">1 heure</text>

    <rect x="728" y="305" width="128" height="147" rx="5" fill="#E8A020"/>
    <text x="792" y="295" fill="#0B1F3A" font-size="17" font-weight="800" text-anchor="middle">× 4,68</text>
    <text x="792" y="480" fill="#4A5A70" font-size="14.5" font-weight="700" text-anchor="middle">3 heures</text>

    <rect x="912" y="218" width="128" height="234" rx="5" fill="#F0645A"/>
    <text x="976" y="208" fill="#0B1F3A" font-size="17" font-weight="800" text-anchor="middle">× 6,85</text>
    <text x="976" y="480" fill="#4A5A70" font-size="14.5" font-weight="700" text-anchor="middle">5 heures</text>
  </g>

  <text x="614" y="512" fill="#62718A" font-size="13.5" font-weight="700" text-anchor="middle">retard initial de l'appareil</text>

  <!-- repere seuil CE261 -->
  <line x1="700" y1="150" x2="700" y2="452" stroke="#0B1F3A" stroke-width="2" stroke-dasharray="6 5" opacity=".45"/>
  <rect x="612" y="150" width="176" height="26" rx="13" fill="#0B1F3A"/>
  <text x="700" y="168" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">seuil des 3 h : 600 €</text>

  <rect x="56" y="536" width="1088" height="60" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="2"/>
  <text x="84" y="562" fill="#0B1F3A" font-size="15.5" font-weight="800">Un petit retard du matin se rattrape en partie. Un gros retard ne se rattrape pas.</text>
  <text x="84" y="584" fill="#374151" font-size="14.5">Passé une certaine ampleur, c'est la journée entière de l'appareil qui bascule, et le dernier vol du soir encaisse le cumul.</text>

  <text x="56" y="620" fill="#8C99AC" font-size="11.5">Multiplicateur réactionnaire, valeurs de référence européennes du coût des retards (University of Westminster pour EUROCONTROL).</text>
</svg>
