<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Déclassé : 75 % du vol concerné, pas du billet entier</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">L'erreur qui transforme un droit réel en déception au moment du versement.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- les paliers -->
  <text x="56" y="132" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.2">CE QUE LA COMPAGNIE REMBOURSE, SELON LA DISTANCE</text>

  <rect x="56" y="150" width="342" height="96" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="227" y="192" fill="#0B1F3A" font-size="30" font-weight="900" text-anchor="middle">30 %</text>
  <text x="227" y="222" fill="#62718A" font-size="13.5" text-anchor="middle">1 500 km ou moins</text>

  <rect x="429" y="150" width="342" height="96" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="600" y="192" fill="#0B1F3A" font-size="30" font-weight="900" text-anchor="middle">50 %</text>
  <text x="600" y="216" fill="#62718A" font-size="12.5" text-anchor="middle">intra-UE &gt; 1 500 km,</text>
  <text x="600" y="233" fill="#62718A" font-size="12.5" text-anchor="middle">et autres vols 1 500 à 3 500 km</text>

  <rect x="802" y="150" width="342" height="96" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="973" y="192" fill="#047857" font-size="30" font-weight="900" text-anchor="middle">75 %</text>
  <text x="973" y="216" fill="#047857" font-size="13" font-weight="700" text-anchor="middle">tous les autres vols</text>
  <text x="973" y="234" fill="#0B1F3A" font-size="12.5" font-weight="700" text-anchor="middle">dont toute l'Europe-Afrique</text>

  <!-- l'assiette : bon vs mauvais calcul -->
  <text x="56" y="292" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.2">75 % DE QUOI ? EXEMPLE D'UN ALLER-RETOUR</text>

  <!-- faux -->
  <rect x="56" y="310" width="530" height="150" rx="14" fill="#FBEBE8" stroke="#C4533F" stroke-width="2.5"/>
  <text x="84" y="342" fill="#B04A3C" font-size="15" font-weight="800">CE QUE BEAUCOUP CROIENT</text>
  <text x="84" y="372" fill="#3C4A5C" font-size="14">75 % du billet aller-retour entier,</text>
  <text x="84" y="392" fill="#3C4A5C" font-size="14">taxes comprises.</text>
  <rect x="84" y="410" width="474" height="34" rx="8" fill="#FFFFFF"/>
  <text x="104" y="433" fill="#B04A3C" font-size="15" font-weight="800">Montant surévalué, souvent le double</text>

  <!-- vrai -->
  <rect x="614" y="310" width="530" height="150" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="642" y="342" fill="#047857" font-size="15" font-weight="800">CE QUE DIT LA COUR DE JUSTICE</text>
  <text x="642" y="372" fill="#0B1F3A" font-size="14">75 % du <tspan font-weight="800">seul vol déclassé</tspan>,</text>
  <text x="642" y="392" fill="#0B1F3A" font-size="14">taxes et redevances exclues.</text>
  <rect x="642" y="410" width="474" height="34" rx="8" fill="#FFFFFF"/>
  <text x="662" y="433" fill="#047857" font-size="15" font-weight="800">Montant juste, celui qui sera versé</text>

  <!-- regles bas -->
  <rect x="56" y="476" width="1088" height="46" rx="12" fill="#0B1F3A"/>
  <text x="88" y="505" fill="#00E5A0" font-size="15" font-weight="800">Dû sous 7 jours, en argent. Un bon d'achat ne peut pas vous être imposé sans votre accord signé.</text>

  <rect x="56" y="530" width="1088" height="42" rx="10" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="88" y="557" fill="#3C4A5C" font-size="14">La circonstance extraordinaire <tspan font-weight="800" fill="#0B1F3A">ne dispense jamais</tspan> de ce remboursement : c'est la restitution d'un service non fourni.</text>

  <text x="56" y="600" fill="#8C99AC" font-size="11.5">Règlement CE 261/2004, article 10 · CJUE, Mennens c/ Emirates, 22 juin 2016, affaire C-255/15 (assiette et exclusion des taxes).</text>
</svg>
