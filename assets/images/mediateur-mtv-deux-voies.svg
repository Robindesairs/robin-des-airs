<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Médiation MTV, seul, ou cession de créance ?</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Deux voies légales vers la même indemnité, deux vitesses opposées.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- Carte gauche : médiation seul -->
  <rect x="56" y="122" width="516" height="372" rx="14" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="2"/>
  <text x="314" y="164" fill="#0B1F3A" font-size="21" font-weight="900" text-anchor="middle">MÉDIATION MTV, SEUL</text>
  <text x="314" y="189" fill="#62718A" font-size="13.5" font-weight="600" text-anchor="middle">Vous portez tout le poids et le temps</text>

  <rect x="84" y="210" width="460" height="48" rx="10" fill="#F3F4F6"/>
  <text x="314" y="239" fill="#374151" font-size="15" font-weight="700" text-anchor="middle">Gratuit, mais 3 à 5 mois d'attente</text>
  <rect x="84" y="268" width="460" height="48" rx="10" fill="#F3F4F6"/>
  <text x="314" y="297" fill="#374151" font-size="15" font-weight="700" text-anchor="middle">Dossier technique à monter soi-même</text>
  <rect x="84" y="326" width="460" height="48" rx="10" fill="#FBEBE8"/>
  <text x="314" y="355" fill="#8A3A2E" font-size="15" font-weight="700" text-anchor="middle">Avis non contraignant : elle peut refuser</text>

  <rect x="134" y="424" width="360" height="46" rx="23" fill="#EDF0F5"/>
  <text x="314" y="453" fill="#3C4A5C" font-size="16" font-weight="900" text-anchor="middle">LENT ET INCERTAIN</text>

  <!-- Carte droite : cession Robin -->
  <rect x="628" y="122" width="516" height="372" rx="14" fill="#EFF9F4" stroke="#00C87A" stroke-width="3"/>
  <text x="886" y="164" fill="#047857" font-size="21" font-weight="900" text-anchor="middle">AVEC ROBIN DES AIRS (CESSION)</text>
  <text x="886" y="189" fill="#0B1F3A" font-size="13.5" font-weight="600" text-anchor="middle">Vous déposez, on s'occupe de tout</text>

  <rect x="656" y="210" width="460" height="48" rx="10" fill="#FFFFFF"/>
  <text x="886" y="239" fill="#0B1F3A" font-size="15" font-weight="800" text-anchor="middle">0 € d'avance, payé au succès</text>
  <rect x="656" y="268" width="460" height="48" rx="10" fill="#FFFFFF"/>
  <text x="886" y="297" fill="#0B1F3A" font-size="15" font-weight="800" text-anchor="middle">Dépôt en 5 min sur WhatsApp ou le site</text>
  <rect x="656" y="326" width="460" height="48" rx="10" fill="#FFFFFF"/>
  <text x="886" y="355" fill="#0B1F3A" font-size="15" font-weight="800" text-anchor="middle">Pas de médiation : assignation directe (B2B)</text>

  <rect x="706" y="424" width="360" height="46" rx="23" fill="#00C87A"/>
  <text x="886" y="453" fill="#04372A" font-size="16" font-weight="900" text-anchor="middle">RAPIDE, RIEN À GÉRER</text>

  <!-- Bas : ancrage légal -->
  <rect x="56" y="512" width="1088" height="74" rx="12" fill="#0B1F3A"/>
  <text x="88" y="542" fill="#FFFFFF" font-size="15.5" font-weight="800">Médiation obligatoire depuis le 7 février 2026, sauf entre professionnels.</text>
  <text x="88" y="566" fill="rgba(255,255,255,.92)" font-size="14.5">La cession transforme votre litige en litige B2B : plus de médiation, on assigne directement.</text>

  <text x="56" y="608" fill="#8C99AC" font-size="11.5">Base légale : décret du 5 août 2025 ; CJUE Lufthansa c/ AirHelp, C-551/24, 9 octobre 2025.</text>
</svg>
