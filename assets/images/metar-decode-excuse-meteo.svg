<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Montserrat, Helvetica, Arial, sans-serif" role="img" aria-label="Décodage bloc par bloc d'un METAR d'orage à Paris-CDG">
  <rect width="1200" height="760" fill="#F7F8FA"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="92" fill="#0B1F3A"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="26" font-weight="800">Décoder un METAR en 10 secondes</text>
  <text x="56" y="73" fill="#00E5A0" font-size="16" font-weight="600">Chaque bloc est une donnée horodatée. Le relevé météo réel de l'aéroport, à l'heure de votre vol.</text>
  <text x="1144" y="58" fill="rgba(255,255,255,.55)" font-size="13" font-weight="700" text-anchor="end">robindesairs.eu</text>

  <!-- the raw string -->
  <rect x="56" y="116" width="1088" height="58" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
  <text x="80" y="153" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#0B1F3A">LFPG 121330Z 24018G30KT 1200 <tspan fill="#C4533F">+TSRA</tspan> BKN008 FEW018CB 15/14 Q1006</text>

  <text x="56" y="212" fill="#62718A" font-size="13" font-weight="800" letter-spacing="1.3">CE QUE CHAQUE BLOC VEUT DIRE</text>

  <!-- grid: 2 columns x 5 rows -->
  <!-- col A x=56 w=524 ; col B x=620 w=524 ; rows y: 226,314,402,490,578 ; h=80 -->
  <g>
    <!-- A1 -->
    <rect x="56" y="226" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="262" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">LFPG</text>
    <text x="80" y="290" fill="#3C4A5C" font-size="17">Aéroport concerné (code OACI) : Paris-CDG</text>
    <!-- A2 -->
    <rect x="56" y="314" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="350" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">121330Z</text>
    <text x="80" y="378" fill="#3C4A5C" font-size="17">Le 12 à 13h30 UTC (heure Zulu)</text>
    <!-- A3 -->
    <rect x="56" y="402" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="438" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">24018G30KT</text>
    <text x="80" y="466" fill="#3C4A5C" font-size="17">Vent du 240°, 18 nœuds, rafales à 30</text>
    <!-- A4 -->
    <rect x="56" y="490" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="80" y="526" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">1200</text>
    <text x="80" y="554" fill="#3C4A5C" font-size="17">Visibilité réduite à 1 200 mètres</text>
    <!-- A5 phenomenon (red) -->
    <rect x="56" y="578" width="524" height="80" rx="9" fill="#FBEBE8" stroke="#C4533F" stroke-width="2.5"/>
    <text x="80" y="614" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#8A3A2E">+TSRA</text>
    <text x="80" y="642" fill="#8A3A2E" font-size="17">Orage avec forte pluie : le phénomène clé</text>

    <!-- B1 -->
    <rect x="620" y="226" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="644" y="262" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">BKN008</text>
    <text x="644" y="290" fill="#3C4A5C" font-size="17">Ciel couvert dès 800 pieds</text>
    <!-- B2 -->
    <rect x="620" y="314" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="644" y="350" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">FEW018CB</text>
    <text x="644" y="378" fill="#3C4A5C" font-size="17">Cumulonimbus (orageux) à 1 800 pieds</text>
    <!-- B3 -->
    <rect x="620" y="402" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="644" y="438" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">15/14</text>
    <text x="644" y="466" fill="#3C4A5C" font-size="17">Température 15°, point de rosée 14°</text>
    <!-- B4 -->
    <rect x="620" y="490" width="524" height="80" rx="9" fill="#FFFFFF" stroke="#E2E6EE" stroke-width="1.5"/>
    <text x="644" y="526" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#0B1F3A">Q1006</text>
    <text x="644" y="554" fill="#3C4A5C" font-size="17">Pression au niveau de la mer : 1006 hPa</text>
    <!-- B5 contrast (green) -->
    <rect x="620" y="578" width="524" height="80" rx="9" fill="#E4F5EE" stroke="#047857" stroke-width="2.5"/>
    <text x="644" y="614" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#047857">CAVOK</text>
    <text x="644" y="642" fill="#04372A" font-size="17">L'inverse : ciel clair, l'excuse météo tombe</text>
  </g>

  <!-- bottom band -->
  <rect x="56" y="678" width="1088" height="56" rx="10" fill="#0B1F3A"/>
  <text x="600" y="713" fill="#FFFFFF" font-size="16.5" font-weight="800" text-anchor="middle">Un bloc « phénomène » présent, ou un CAVOK qui l'exclut : le METAR tranche, à la minute près.</text>
</svg>
