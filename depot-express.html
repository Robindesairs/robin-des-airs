<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Traceurs publicitaires (Meta Pixel + Google Ads) : chargés UNIQUEMENT après consentement, cf. /assets/consent.js -->
<script defer src="/assets/consent.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Déposer mon dossier en 2 minutes, Robin des Airs</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://robindesairs.eu/depot-express.html">
  <meta property="og:title" content="Déposer mon dossier, Robin des Airs">
  <meta property="og:description" content="Répondez à quelques questions, glissez votre passeport, signez : votre dossier part en 2 minutes. 0 € sans résultat (CE 261).">
  <meta property="og:image" content="https://robindesairs.eu/robin-des-airs-og-1200x630-v2.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Déposer mon dossier, Robin des Airs">
  <meta name="twitter:description" content="Votre dossier en 2 minutes, sans WhatsApp. 0 € sans résultat.">
  <meta name="twitter:image" content="https://robindesairs.eu/robin-des-airs-og-1200x630-v2.jpg">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/portail-premium.css">
  <style>
    /* ── Tunnel « un écran = une question » aux couleurs du site.
         Un clic sur une option = réponse enregistrée + écran suivant (aucun bouton Valider).
         Les réponses restent visibles en chips sous la barre de progression : un tap = correction. ── */

    /* Barre de progression fine */
    .prog{height:5px; background:var(--line); border-radius:var(--radius-pill); overflow:hidden; margin:2px 0 10px}
    .prog i{display:block; height:100%; width:0; border-radius:var(--radius-pill);
      background:linear-gradient(90deg,var(--neon),var(--neon-b)); transition:width .25s var(--ease)}

    /* Chips récap : tout ce qui est rempli reste affiché, cliquable pour corriger */
    .crumbs{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 14px; min-height:0}
    .crumbs button{
      display:inline-flex; align-items:center; gap:6px; max-width:100%;
      font:inherit; font-size:12.5px; font-weight:700; color:var(--navy);
      background:var(--green-tint); border:1px solid var(--green-line); border-radius:var(--radius-pill);
      padding:7px 12px; cursor:pointer; transition:.13s; animation:rise .25s var(--ease) both;
    }
    .crumbs button:hover{border-color:var(--neon-dark); background:#dff4ea}
    .crumbs button .x{font-size:11px; opacity:.65}
    .crumbs button b{font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px}

    /* Écrans : transition rapide (160 ms), jamais d'attente */
    .screen{animation:slidein .18s var(--ease) both}
    @keyframes slidein{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}
    .screen.backwards{animation:slideback .18s var(--ease) both}
    @keyframes slideback{from{opacity:0; transform:translateX(-14px)}to{opacity:1; transform:none}}
    .screen h2{font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--navy); margin:2px 0 4px}
    .screen .sub{color:var(--ink-soft); font-size:14px; margin:0 0 12px}

    /* Options rectangulaires : LA réponse = un clic */
    .opts{display:flex; flex-direction:column; gap:9px}
    .opts.grid2{display:grid; grid-template-columns:1fr 1fr; gap:9px}
    .opts button{
      display:flex; align-items:center; gap:12px; width:100%; text-align:left;
      min-height:56px; padding:13px 16px;
      background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-sm);
      font:inherit; font-size:15px; font-weight:700; color:var(--navy); cursor:pointer;
      transition:border-color .12s, background .12s, transform .08s;
      box-shadow:var(--shadow-card);
    }
    .opts button .ic{flex:0 0 34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:17px; background:var(--green-tint)}
    .opts button small{display:block; font-weight:500; font-size:12.5px; color:var(--muted); margin-top:1px}
    .opts button:hover{border-color:var(--neon); background:var(--green-tint)}
    .opts button:active,.opts button.hit{transform:scale(.985); border-color:var(--neon-dark); background:var(--green-tint)}
    .opts button.ghost{box-shadow:none; border-style:dashed; color:var(--ink-soft); font-weight:600}

    /* Saisie : Entrée ou ➜ envoie */
    .askrow{display:flex; gap:9px; align-items:stretch}
    .askrow .input{flex:1; min-width:0; font-size:16px}
    .askrow .ok{
      flex:0 0 54px; border:0; border-radius:var(--radius-sm); cursor:pointer; font-size:20px; color:#06351f;
      background:linear-gradient(135deg,var(--neon),var(--neon-b)); box-shadow:var(--shadow-btn); transition:.12s;
    }
    .askrow .ok:active{transform:scale(.96)}

    /* Dépôt passeport */
    .drop{
      border:2px dashed var(--neon); border-radius:var(--radius-sm); background:var(--green-tint);
      padding:22px 16px; text-align:center; cursor:pointer; transition:.15s;
    }
    .drop.over{background:#dff4ea; border-color:var(--neon-dark)}
    .drop .big{font-size:32px; line-height:1}
    .drop p{font-size:14px; color:var(--neon-ink); font-weight:800; margin:7px 0 0}
    .drop small{display:block; color:var(--muted); font-weight:500; font-size:11.5px; margin-top:4px}
    .idcard{margin:0 0 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; font-size:14.5px; color:var(--navy)}
    .idcard div{padding:2px 0}

    /* Retour : discret, toujours là quand on peut reculer */
    .navrow{display:flex; align-items:center; justify-content:space-between; margin-top:16px; min-height:24px}
    .navrow .prev{border:0; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--muted); padding:6px 2px}
    .navrow .prev:hover{color:var(--navy)}
    .navrow .skip{border:0; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--muted); text-decoration:underline; padding:6px 2px}
    .navrow .skip:hover{color:var(--navy)}

    /* Signature */
    .sig{border:1.5px dashed var(--line-2); border-radius:var(--radius-sm); background:#fff; position:relative; touch-action:none; margin:12px 0 0}
    .sig canvas{display:block; width:100%; height:118px; border-radius:var(--radius-sm); touch-action:none}
    .sig .ph{position:absolute; inset:0; display:grid; place-items:center; color:#9aa7b6; font-size:13.5px; pointer-events:none}
    .sig .clr{position:absolute; top:7px; right:7px; border:1px solid var(--line); background:#fff; border-radius:var(--radius-pill); font-size:11.5px; font-weight:700; color:var(--muted); padding:4px 11px; cursor:pointer; display:none}
    .ck{display:flex; gap:10px; align-items:flex-start; margin-top:11px; font-size:12.9px; line-height:1.55; color:var(--ink-soft); cursor:pointer}
    .ck input{margin-top:2px; width:17px; height:17px; flex:none; accent-color:var(--neon-dark)}
    .ck a{color:var(--neon-ink); font-weight:700}
    .suberr{display:none; margin-top:10px; font-size:13px; font-weight:600; color:var(--danger); background:var(--danger-bg); border:1px solid #f3c6c0; border-radius:var(--radius-sm); padding:10px 12px}
    .suberr.on{display:block}
    .suberr a{color:var(--danger)}
    .wa-alt{margin-top:16px; font-size:12.5px; color:var(--muted); text-align:center}
    .wa-alt a{color:var(--neon-ink); font-weight:700; text-decoration:none}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">Robin <span class="accent">des Airs</span> <span class="bow">🏹</span></a>
    <span style="color:rgba(255,255,255,.85); font-size:12.5px; font-weight:700">⏱️ 2 min · 0 € d'avance</span>
  </header>

  <main class="shell">
    <div class="pagehead" style="margin-bottom:12px">
      <h1 style="font-size:22px">Votre dossier, en 2 minutes.</h1>
      <p class="lead">Un clic par question, c'est tout. Jusqu'à <b>600 € par personne</b> (CE 261/2004).</p>
    </div>

    <div class="prog" aria-hidden="true"><i id="fill"></i></div>
    <div class="crumbs" id="crumbs" aria-label="Vos réponses (touchez pour corriger)"></div>

    <section class="panel" id="stage" aria-live="polite"></section>

    <p class="wa-alt">💬 Vous préférez WhatsApp ? <a href="https://wa.me/33756863630" target="_blank" rel="noopener">wa.me/33756863630</a></p>
  </main>

  <input type="file" id="fileInp" accept="image/*,application/pdf" hidden>
  <input type="file" id="camInp" accept="image/*" capture="environment" hidden>
  <!-- Honeypot anti-spam (depot-create l'exige vide) -->
  <input type="text" id="website" name="website" value="" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  // ── État du dossier ─────────────────────────────────────────────────────────
  var S = {
    incident: '', flightNum: '', dep: '', arr: '', date: '',
    typeVol: '', via: '',                 // direct | escale (+ ville d'escale facultative)
    pax: 0, names: [], paxData: [],       // paxData[i] = { dob, minor, sig } pour chaque passager
    piece: null, pieceFile: null,
    phone: '', email: '', startNow: false,
  };
  // Mineur à la date du vol (même logique que le bot) : un parent signe pour lui.
  function isMinor(dobFr, flightIso){
    var b = (dobFr || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (!b) return false;
    var birth = new Date(+b[3], +b[2] - 1, +b[1]);
    var ref = flightIso ? new Date(flightIso) : new Date();
    var age = ref.getFullYear() - birth.getFullYear();
    if (ref.getMonth() < birth.getMonth() || (ref.getMonth() === birth.getMonth() && ref.getDate() < birth.getDate())) age--;
    return age < 18;
  }
  var REF = '';
  var INCIDENT_LABEL = { delay: 'Retard +3 h', cancel: 'Annulation', denied: "Refus d'embarquement" };
  function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, function(c){ return c==='<'?'&lt;':c==='>'?'&gt;':'&amp;'; }); }

  // ── Moteur d'écrans : clic = suivant, retour possible, chips toujours visibles ──
  // FLOW = l'ordre nominal. `idx` = position courante ; `far` = écran le plus loin atteint.
  // Corriger via une chip re-ouvre l'écran, puis la réponse renvoie DIRECT au point le plus loin.
  var FLOW = ['incident', 'flight', 'conn', 'date', 'pax', 'passport', 'copax', 'phone', 'email', 'sign'];
  var idx = 0, far = 0, editing = false, backwards = false;
  function applicable(k){ return k !== 'copax' || S.pax > 1; }
  function render(){
    $('fill').style.width = Math.round(far / (FLOW.length - 1) * 100) + '%';
    renderCrumbs();
    stage.innerHTML = '';
    var sc = document.createElement('div'); sc.className = 'screen' + (backwards ? ' backwards' : '');
    backwards = false;
    stage.appendChild(sc);
    SCREENS[FLOW[idx]](sc);
    window.scrollTo({ top: 0 });
  }
  // Un clic d'option : petit flash visuel (90 ms) puis écran suivant — RIEN d'autre à confirmer.
  function hit(btn, fn){ btn.classList.add('hit'); setTimeout(fn, 90); }
  function next(){
    if (editing) { editing = false; idx = far; render(); return; } // correction → retour direct où on en était
    do { idx++; } while (idx < FLOW.length - 1 && !applicable(FLOW[idx]));
    if (idx > far) far = idx;
    render();
  }
  function back(){
    if (idx === 0) return;
    backwards = true; editing = false;
    do { idx--; } while (idx > 0 && !applicable(FLOW[idx]));
    render();
  }
  function jump(k){ editing = true; backwards = true; idx = FLOW.indexOf(k); render(); }

  // Chips : chaque réponse déjà donnée, cliquable pour la corriger
  function renderCrumbs(){
    var c = $('crumbs'); c.innerHTML = '';
    var items = [];
    if (S.incident) items.push(['incident', '⏱️', INCIDENT_LABEL[S.incident]]);
    if (S.flightNum || (S.dep && S.arr)) items.push(['flight', '✈️', S.flightNum || (S.dep + ' → ' + S.arr)]);
    if (S.typeVol) items.push(['conn', '🛤️', S.typeVol === 'direct' ? 'Direct' : ('Escale' + (S.via ? ' · ' + S.via : ''))]);
    if (S.date) items.push(['date', '📅', S.date.split('-').reverse().join('/')]);
    if (S.pax) items.push(['pax', '👪', S.pax + ' pax']);
    if (S.names[0]) items.push(['passport', '🛂', S.names[0]]);
    var others = S.names.slice(1).filter(Boolean);
    if (others.length) items.push(['copax', '👥', others.length + ' co-passager' + (others.length > 1 ? 's' : '')]);
    if (S.phone) items.push(['phone', '📞', S.phone]);
    if (S.email) items.push(['email', '📧', S.email]);
    items.forEach(function(it){
      var b = document.createElement('button'); b.type = 'button';
      b.innerHTML = it[1] + ' <b>' + esc(it[2]) + '</b> <span class="x">✏️</span>';
      b.title = 'Corriger';
      b.addEventListener('click', function(){ jump(it[0]); });
      c.appendChild(b);
    });
  }
  // Bloc navigation bas d'écran : ← Retour (si possible) + éventuel « passer »
  function navRow(sc, opts){
    opts = opts || {};
    var n = document.createElement('div'); n.className = 'navrow';
    var left = document.createElement('span');
    if (idx > 0) {
      var p = document.createElement('button'); p.type = 'button'; p.className = 'prev'; p.textContent = '← Retour';
      p.addEventListener('click', back); left = p;
    }
    n.appendChild(left);
    if (opts.skip) {
      var s = document.createElement('button'); s.type = 'button'; s.className = 'skip'; s.textContent = opts.skip;
      s.addEventListener('click', opts.onSkip); n.appendChild(s);
    }
    sc.appendChild(n);
  }
  function optButton(html, fn, ghost){
    var b = document.createElement('button'); b.type = 'button';
    if (ghost) b.className = 'ghost';
    b.innerHTML = html;
    b.addEventListener('click', function(){ hit(b, fn); });
    return b;
  }
  // Saisie rectangulaire : Entrée ou ➜ valide et enchaîne
  function inputRow(sc, cfg){
    var row = document.createElement('div'); row.className = 'askrow';
    var i = document.createElement('input'); i.className = 'input' + (cfg.mono ? ' mono' : '');
    i.type = cfg.type || 'text'; i.placeholder = cfg.placeholder || '';
    if (cfg.inputmode) i.inputMode = cfg.inputmode;
    if (cfg.autocomplete) i.autocomplete = cfg.autocomplete;
    if (cfg.value) i.value = cfg.value;
    var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'ok'; ok.textContent = '➜';
    row.appendChild(i); row.appendChild(ok);
    var hint = document.createElement('div'); hint.className = 'hint idle'; hint.textContent = cfg.hint || '';
    sc.appendChild(row); sc.appendChild(hint);
    function go(){
      var v = i.value.trim();
      var err = cfg.validate(v);
      if (err) { i.classList.add('bad'); hint.className = 'hint bad'; hint.textContent = err; return; }
      i.classList.remove('bad'); cfg.done(v);
    }
    ok.addEventListener('click', go);
    i.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); go(); } });
    setTimeout(function(){ i.focus(); }, 120);
    return i;
  }

  // ── Les écrans ──────────────────────────────────────────────────────────────
  var SCREENS = {
    incident: function(sc){
      sc.innerHTML = '<h2>✈️ Que s\'est-il passé avec votre vol ?</h2><p class="sub">Un clic, on enchaîne.</p>';
      var o = document.createElement('div'); o.className = 'opts';
      o.appendChild(optButton('<span class="ic">⏱️</span><span>Retard de 3 h ou +<small>Arrivée avec au moins 3 h de retard</small></span>', function(){ S.incident = 'delay'; next(); }));
      o.appendChild(optButton('<span class="ic">🚫</span><span>Vol annulé<small>Votre vol n\'a pas eu lieu</small></span>', function(){ S.incident = 'cancel'; next(); }));
      o.appendChild(optButton('<span class="ic">🛑</span><span>Refus d\'embarquement<small>Surbooking : embarquement refusé</small></span>', function(){ S.incident = 'denied'; next(); }));
      sc.appendChild(o); navRow(sc);
    },
    flight: function(sc){
      sc.innerHTML = '<h2>🔎 Votre numéro de vol ?</h2><p class="sub">Il est sur votre billet (ex. AF719, SN204).</p>';
      inputRow(sc, {
        placeholder: 'ex. AF719', mono: true, value: S.flightNum,
        validate: function(v){
          if (!v) return 'Indiquez votre numéro de vol, ou touchez « Je ne l\'ai pas » en dessous.';
          var c = v.toUpperCase().replace(/\s+/g,'');
          return /^[A-Z]{1,3}\d{1,5}[A-Z]?$/.test(c) ? '' : 'Ce numéro ne ressemble pas à un vol (ex. AF719).';
        },
        done: function(v){ S.flightNum = v.toUpperCase().replace(/\s+/g,''); S.dep = ''; S.arr = ''; next(); },
      });
      var o = document.createElement('div'); o.className = 'opts'; o.style.marginTop = '10px';
      o.appendChild(optButton('<span class="ic">🗺️</span><span>Je ne l\'ai pas — je donne le trajet<small>ex. Dakar → Paris</small></span>', function(){
        sc.innerHTML = '<h2>🗺️ Votre trajet ?</h2><p class="sub">Ville de départ et ville d\'arrivée.</p>';
        inputRow(sc, {
          placeholder: 'ex. Dakar - Paris', value: (S.dep && S.arr) ? S.dep + ' - ' + S.arr : '',
          validate: function(v){
            var p = v.split(/→|->|—|,|\/|-/).map(function(x){ return x.trim(); }).filter(Boolean);
            return (p.length >= 2 && p[0].length >= 2 && p[1].length >= 2) ? '' : 'Écrivez les deux villes, ex. « Dakar - Paris ».';
          },
          done: function(v){
            var p = v.split(/→|->|—|,|\/|-/).map(function(x){ return x.trim(); }).filter(Boolean);
            S.dep = p[0]; S.arr = p[p.length - 1]; S.flightNum = ''; next();
          },
        });
        navRow(sc);
      }, true));
      sc.appendChild(o); navRow(sc);
    },
    conn: function(sc){
      sc.innerHTML = '<h2>🛤️ Ce vol était-il direct ?</h2><p class="sub">Avec une escale, l\'indemnité se calcule sur le trajet complet.</p>';
      var o = document.createElement('div'); o.className = 'opts';
      o.appendChild(optButton('<span class="ic">✈️</span><span>Oui, vol direct</span>', function(){ S.typeVol = 'direct'; S.via = ''; next(); }));
      o.appendChild(optButton('<span class="ic">🔄</span><span>Non, avec escale<small>ex. via Casablanca, Istanbul…</small></span>', function(){
        sc.innerHTML = '<h2>🔄 Dans quelle ville, l\'escale ?</h2><p class="sub">Si vous ne savez plus, passez — un expert la retrouvera.</p>';
        inputRow(sc, {
          placeholder: 'ex. Casablanca', value: S.via,
          validate: function(v){ return v.length >= 2 ? '' : 'Indiquez la ville, ou passez en dessous.'; },
          done: function(v){ S.typeVol = 'escale'; S.via = v; next(); },
        });
        navRow(sc, { skip: '⏭️ Je ne sais plus', onSkip: function(){ S.typeVol = 'escale'; S.via = ''; next(); } });
      }));
      sc.appendChild(o); navRow(sc);
    },
    date: function(sc){
      sc.innerHTML = '<h2>📅 La date du vol ?</h2><p class="sub">Elle passe toute seule dès que vous la choisissez.</p>';
      var i = document.createElement('input'); i.className = 'input'; i.type = 'date';
      i.max = new Date().toISOString().slice(0, 10);
      if (S.date) i.value = S.date;
      sc.appendChild(i);
      i.addEventListener('change', function(){ if (i.value) { S.date = i.value; next(); } });
      navRow(sc);
      setTimeout(function(){ try { i.showPicker ? i.showPicker() : i.focus(); } catch(_) { i.focus(); } }, 200);
    },
    pax: function(sc){
      sc.innerHTML = '<h2>👪 Combien de passagers ?</h2><p class="sub">Chaque billet compte — jusqu\'à 600 € par personne.</p>';
      var o = document.createElement('div'); o.className = 'opts grid2';
      [1,2,3,4,5].forEach(function(n){
        o.appendChild(optButton('<span class="ic">' + n + '</span><span>' + (n === 1 ? '1 passager' : n + ' passagers') + '<small>jusqu\'à ' + (600 * n).toLocaleString('fr-FR') + ' €</small></span>', function(){ S.pax = n; next(); }));
      });
      o.appendChild(optButton('<span class="ic">6+</span><span>6 ou plus<small>on gère votre groupe</small></span>', function(){
        sc.innerHTML = '<h2>👪 Combien exactement ?</h2>';
        inputRow(sc, {
          placeholder: 'ex. 7', inputmode: 'numeric',
          validate: function(v){ var n = parseInt(v, 10); return (n >= 6 && n <= 30) ? '' : 'Un nombre entre 6 et 30.'; },
          done: function(v){ S.pax = parseInt(v, 10); next(); },
        });
        navRow(sc);
      }));
      sc.appendChild(o); navRow(sc);
    },
    passport: function(sc){
      sc.innerHTML = '<h2>🛂 Votre passeport (ou carte d\'identité)</h2><p class="sub"><b>On lit tout, vous n\'écrivez rien.</b></p>';
      var drop = document.createElement('div'); drop.className = 'drop';
      drop.innerHTML = '<div class="big">📄</div><p>Glissez votre pièce ici</p><small>🔒 Lue par une IA pour pré-remplir votre contrat, jamais revendue</small>';
      sc.appendChild(drop);
      // 2 vraies options rectangulaires : photo (caméra sur mobile) ou fichier (galerie / PDF)
      var o = document.createElement('div'); o.className = 'opts grid2'; o.style.marginTop = '10px';
      o.appendChild(optButton('<span class="ic">📷</span><span>Prendre une photo</span>', function(){ $('camInp').value = ''; $('camInp').click(); }));
      o.appendChild(optButton('<span class="ic">🖼️</span><span>Choisir un fichier<small>photo ou PDF</small></span>', function(){ $('fileInp').value = ''; $('fileInp').click(); }));
      sc.appendChild(o);
      var hint = document.createElement('div'); hint.className = 'hint idle'; sc.appendChild(hint);
      drop.addEventListener('click', function(){ $('fileInp').value = ''; $('fileInp').click(); });
      drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });

  function toJpeg(file){
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){
        var MAX = 1600, w = img.width, h = img.height;
        if (Math.max(w, h) > MAX) { var k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  function handleFile(file, sc, hint){
    if (file.size > 15 * 1024 * 1024) { hint.className = 'hint bad'; hint.textContent = 'Fichier très lourd — reprenez une photo simple de la pièce.'; return; }
    if (/pdf$/i.test(file.type)) {
      var r = new FileReader();
      r.onload = function(){ S.pieceFile = { dataBase64: String(r.result).split(',')[1], mime: 'application/pdf', filename: file.name || 'passeport.pdf' }; };
      r.readAsDataURL(file);
      manualName(sc); // PDF : rangé au dossier, le nom se tape (l'OCR web lit les photos)
      return;
    }
    hint.className = 'hint ok'; hint.textContent = '🔍 Lecture de votre pièce…';
    toJpeg(file).then(function(b64){
      S.pieceFile = { dataBase64: b64, mime: 'image/jpeg', filename: (file.name || 'passeport') + '.jpg' };
      return fetch('/api/ocr-piece', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataBase64: b64, mime: 'image/jpeg' }),
      }).then(function(r){ return r.json(); });
    }).then(function(j){
      if (j && j.ok && j.piece && j.piece.name) return confirmPiece(sc, j.piece);
      hint.className = 'hint bad'; hint.textContent = 'Lecture difficile (photo sombre ou floue ?) — tapez votre nom :';
      setTimeout(function(){ manualName(sc); }, 600);
    }).catch(function(){
      hint.className = 'hint bad'; hint.textContent = 'Petit souci de lecture — tapez votre nom :';
      setTimeout(function(){ manualName(sc); }, 600);
    });
  }

      if (i > 0 && !pd.minor) { base.signatureImg = pd.sig || ''; base.signaturePending = !!pd.sigPending; } // co-adulte : sa signature (ou à recueillir)

      // La pièce lue rejoint le dossier (best-effort — le succès de la signature n'en dépend pas)

    window.scrollTo({ top: 0 });
    setTimeout(function(){ window.location.href = pieces; }, 6000);
  }

  render();
})();
</script>
