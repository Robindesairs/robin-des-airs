<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Traceurs publicitaires (Meta Pixel + Google Ads) : chargés UNIQUEMENT après consentement, cf. /assets/consent.js -->
<script defer src="/assets/consent.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Déposer mon dossier en 2 minutes, Robin des Airs</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://robindesairs.eu/depot-express.html">
  <meta property="og:title" content="Déposer mon dossier, Robin des Airs">
  <meta property="og:description" content="Répondez à quelques questions, glissez votre passeport, signez : votre dossier part en 2 minutes. 0 € sans résultat (CE 261).">
  <meta property="og:image" content="https://robindesairs.eu/robin-des-airs-og-1200x630-v2.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Déposer mon dossier, Robin des Airs">
  <meta name="twitter:description" content="Votre dossier en 2 minutes, sans WhatsApp. 0 € sans résultat.">
  <meta name="twitter:image" content="https://robindesairs.eu/robin-des-airs-og-1200x630-v2.jpg">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    /* ── Tunnel conversationnel « façon WhatsApp » — une question à la fois, zéro friction ── */
    :root{
      --navy:#0B1F3A; --neon:#00C87A; --neon-ink:#047857; --neon-dark:#059669;
      --chat-bg:#EAE3D9; --bot:#FFFFFF; --me:#DCF8C6; --line:#E3DED4;
      --ink:#132A20; --muted:#6B7A73; --danger:#C0392B;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%}
    body{
      font-family:'Montserrat',system-ui,sans-serif; background:var(--chat-bg); color:var(--ink);
      display:flex; flex-direction:column; min-height:100dvh;
    }
    /* Barre haute, codes WhatsApp (vert, avatar, « en ligne ») → repère immédiat, confiance */
    .bar{
      position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:11px;
      background:linear-gradient(135deg,#065F46,#047857); color:#fff; padding:10px 14px;
      padding-top:calc(10px + env(safe-area-inset-top));
      box-shadow:0 2px 10px rgba(6,53,35,.28);
    }
    .bar .ava{width:40px; height:40px; flex:none; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:20px}
    .bar .who{min-width:0; flex:1}
    .bar .who b{display:block; font-size:15.5px; letter-spacing:-.01em}
    .bar .who span{display:block; font-size:12px; color:#BFEAD9}
    .bar .badge{flex:none; font-size:11px; font-weight:700; background:rgba(255,255,255,.16); border-radius:999px; padding:5px 10px; white-space:nowrap}
    /* Fil de conversation */
    .chat{flex:1; width:100%; max-width:560px; margin:0 auto; padding:14px 12px 130px; overflow-anchor:auto}
    .msg{display:flex; margin:7px 0; animation:pop .22s ease-out both}
    @keyframes pop{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
    .msg .b{
      max-width:86%; padding:10px 13px; border-radius:14px; font-size:14.5px; line-height:1.5;
      box-shadow:0 1px 1.5px rgba(11,31,58,.13); white-space:pre-wrap; word-wrap:break-word;
    }
    .msg.bot .b{background:var(--bot); border-top-left-radius:4px}
    .msg.me{justify-content:flex-end}
    .msg.me .b{background:var(--me); border-top-right-radius:4px}
    .msg .b b{color:var(--navy)}
    .msg .b small{display:block; color:var(--muted); font-size:12px; margin-top:3px}
    /* « Robin écrit… » */
    .typing .b{display:inline-flex; gap:5px; align-items:center; padding:13px 15px}
    .typing .d{width:7px; height:7px; border-radius:50%; background:#B9C4BE; animation:blink 1s infinite}
    .typing .d:nth-child(2){animation-delay:.18s}.typing .d:nth-child(3){animation-delay:.36s}
    @keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
    /* Boutons de réponse rapide (tap = réponse + question suivante, AUCUNE confirmation) */
    .qr{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 10px; padding-left:4px}
    .qr button{
      font:inherit; font-size:14px; font-weight:700; color:var(--neon-ink);
      background:#fff; border:1.5px solid var(--neon); border-radius:999px;
      padding:10px 16px; min-height:44px; cursor:pointer; transition:.13s;
      box-shadow:0 1px 1.5px rgba(11,31,58,.10);
    }
    .qr button:hover{background:#EAFBF3}
    .qr button:active{transform:scale(.97)}
    .qr button.ghost{border-color:var(--line); color:var(--muted); font-weight:600}
    /* Barre de saisie basse (uniquement quand la question attend du texte) */
    .inbar{
      position:fixed; left:0; right:0; bottom:0; z-index:20; display:none;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(0deg,var(--chat-bg) 82%,transparent);
    }
    .inbar.on{display:block}
    .inbar .wrap{max-width:560px; margin:0 auto; display:flex; gap:8px; align-items:flex-end}
    .inbar input,.inbar textarea{
      flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink);
      background:#fff; border:1.5px solid var(--line); border-radius:24px;
      padding:12px 16px; outline:none; resize:none; max-height:110px;
    }
    .inbar input:focus,.inbar textarea:focus{border-color:var(--neon)}
    .inbar .send{
      flex:none; width:48px; height:48px; border:0; border-radius:50%; cursor:pointer;
      background:linear-gradient(135deg,var(--neon),var(--neon-dark)); color:#fff; font-size:20px;
      display:grid; place-items:center; box-shadow:0 3px 10px rgba(5,150,105,.35); transition:.13s;
    }
    .inbar .send:active{transform:scale(.94)}
    .inbar .err{max-width:560px; margin:6px auto 0; font-size:12.5px; font-weight:600; color:var(--danger); display:none; padding-left:8px}
    .inbar .err.on{display:block}
    /* Zone de dépôt passeport (glisser-déposer / photo) */
    .drop{
      margin-top:9px; border:2px dashed var(--neon); border-radius:12px; background:#F4FBF7;
      padding:18px 14px; text-align:center; cursor:pointer; transition:.15s;
    }
    .drop.over{background:#E2F7EC; border-color:var(--neon-dark)}
    .drop .big{font-size:30px; line-height:1}
    .drop p{font-size:13.5px; color:var(--neon-ink); font-weight:700; margin-top:6px}
    .drop small{display:block; color:var(--muted); font-weight:500; font-size:11.5px; margin-top:3px}
    /* Carte de confirmation OCR */
    .idcard{margin-top:8px; background:#F8FBF9; border:1px solid #DCEBE2; border-radius:10px; padding:10px 12px; font-size:14px}
    .idcard div{padding:2px 0}
    /* Date inline dans la bulle */
    .dt{margin-top:9px}
    .dt input{font:inherit; font-size:16px; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; background:#fff; width:100%}
    .dt input:focus{outline:none; border-color:var(--neon)}
    /* Récap + signature */
    .recap{margin-top:8px; font-size:14px}
    .recap .r{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed #E4E9E4}
    .recap .r:last-child{border-bottom:0}
    .recap .k{flex:0 0 84px; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px}
    .recap .v{flex:1; font-weight:600; color:var(--navy); min-width:0; overflow-wrap:anywhere}
    .recap .e{flex:none; border:0; background:none; cursor:pointer; font-size:15px; padding:4px; opacity:.7}
    .recap .e:hover{opacity:1}
    .sig{margin-top:10px; border:1.5px dashed #C9D6CD; border-radius:10px; background:#fff; position:relative; touch-action:none}
    .sig canvas{display:block; width:100%; height:110px; border-radius:10px; touch-action:none}
    .sig .ph{position:absolute; inset:0; display:grid; place-items:center; color:#A9B7AE; font-size:13px; pointer-events:none}
    .sig .clr{position:absolute; top:6px; right:6px; border:1px solid var(--line); background:#fff; border-radius:999px; font-size:11px; font-weight:700; color:var(--muted); padding:4px 10px; cursor:pointer; display:none}
    .ck{display:flex; gap:9px; align-items:flex-start; margin-top:10px; font-size:12.8px; line-height:1.5; cursor:pointer}
    .ck input{margin-top:2px; width:17px; height:17px; flex:none; accent-color:var(--neon-dark)}
    .ck a{color:var(--neon-ink); font-weight:700}
    .go{
      display:block; width:100%; margin-top:13px; border:0; border-radius:12px; cursor:pointer;
      background:linear-gradient(135deg,var(--neon),var(--neon-dark)); color:#fff;
      font:inherit; font-size:15.5px; font-weight:800; padding:15px; letter-spacing:.01em;
      box-shadow:0 4px 14px rgba(5,150,105,.35); transition:.15s;
    }
    .go:disabled{opacity:.45; cursor:default; box-shadow:none}
    .go:not(:disabled):active{transform:scale(.985)}
    .suberr{display:none; margin-top:9px; font-size:12.8px; font-weight:600; color:var(--danger); background:#FDF0EE; border:1px solid #F3C6C0; border-radius:9px; padding:9px 11px}
    .suberr.on{display:block}
    .suberr a{color:var(--danger)}
    .foot-secure{max-width:560px; margin:2px auto 0; padding:0 14px; font-size:11px; color:var(--muted); text-align:center}
    @media (min-width:640px){ .chat{padding-top:22px} .msg .b{font-size:15px} }
  </style>
</head>
<body>
  <!-- Barre type WhatsApp : repère immédiat, « en ligne » = quelqu'un s'occupe de moi -->
  <header class="bar">
    <span class="ava" aria-hidden="true">🏹</span>
    <div class="who"><b>Robin des Airs</b><span>en ligne · répond en direct</span></div>
    <span class="badge">⏱️ 2 min · 0 € d'avance</span>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <!-- Barre de saisie (montrée uniquement quand une réponse texte est attendue) -->
  <div class="inbar" id="inbar">
    <div class="wrap">
      <input id="inp" type="text" autocomplete="off" placeholder="Votre réponse…" aria-label="Votre réponse">
      <button class="send" id="sendBtn" aria-label="Envoyer">➤</button>
    </div>
    <div class="err" id="inpErr"></div>
  </div>

  <input type="file" id="fileInp" accept="image/*,application/pdf" hidden>
  <!-- Honeypot anti-spam (depot-create l'exige vide) -->
  <input type="text" id="website" name="website" value="" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), inbar = $('inbar'), inp = $('inp');

  // ── État du dossier ─────────────────────────────────────────────────────────
  var S = {
    incident: '', flightNum: '', dep: '', arr: '', date: '',
    pax: 1, names: [], piece: null, pieceFile: null, // pieceFile = {dataBase64, mime, filename}
    phone: '', email: '', startNow: false,
  };
  var REF = '';
  var INCIDENT_LABEL = { delay: 'Retard +3 h', cancel: 'Annulation', denied: "Refus d'embarquement" };
  var editReturn = false; // réponse en cours = correction depuis le récap → on y retourne direct

  // ── Briques de conversation ────────────────────────────────────────────────
  function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, function(c){ return c==='<'?'&lt;':c==='>'?'&gt;':'&amp;'; }); }
  function scrollEnd(){ requestAnimationFrame(function(){ window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }); }
  function bubble(html, me){
    var m = document.createElement('div'); m.className = 'msg ' + (me ? 'me' : 'bot');
    var b = document.createElement('div'); b.className = 'b'; b.innerHTML = html;
    m.appendChild(b); chat.appendChild(m); scrollEnd(); return b;
  }
  // « Robin écrit… » ~450 ms avant chaque question → rythme de vraie conversation, sans ralentir
  function botSays(html, cb){
    var t = document.createElement('div'); t.className = 'msg bot typing';
    t.innerHTML = '<div class="b"><span class="d"></span><span class="d"></span><span class="d"></span></div>';
    chat.appendChild(t); scrollEnd();
    setTimeout(function(){ t.remove(); var b = bubble(html, false); if (cb) cb(b); }, 450);
  }
  function meSays(text){ bubble(esc(text), true); }
  // Boutons de réponse rapide : un tap répond ET enchaîne — retirés après usage (pas de retour en arrière)
  function quick(opts){
    var w = document.createElement('div'); w.className = 'qr';
    opts.forEach(function(o){
      var btn = document.createElement('button'); btn.type = 'button';
      if (o.ghost) btn.className = 'ghost';
      btn.textContent = o.t;
      btn.addEventListener('click', function(){ w.remove(); o.f(); });
      w.appendChild(btn);
    });
    chat.appendChild(w); scrollEnd(); return w;
  }
  // Saisie texte : Entrée ou ➤ envoie ; validate() renvoie '' si OK, sinon le message d'erreur
  var onSend = null;
  function ask(placeholder, opts){
    opts = opts || {};
    inp.value = ''; inp.placeholder = placeholder;
    inp.type = opts.type || 'text';
    inp.inputMode = opts.inputmode || 'text';
    inp.autocomplete = opts.autocomplete || 'off';
    $('inpErr').classList.remove('on');
    inbar.classList.add('on');
    onSend = function(){
      var v = inp.value.trim();
      var err = opts.validate ? opts.validate(v) : (v ? '' : 'Écrivez votre réponse.');
      if (err) { $('inpErr').textContent = err; $('inpErr').classList.add('on'); return; }
      inbar.classList.remove('on'); onSend = null;
      meSays(v); opts.done(v);
    };
    setTimeout(function(){ inp.focus(); }, 120);
  }
  $('sendBtn').addEventListener('click', function(){ if (onSend) onSend(); });
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && onSend) { e.preventDefault(); onSend(); } });

  // ── Le tunnel : une question, un tap, question suivante ───────────────────
  function start(){
    botSays("👋 Bonjour ! Je suis l'assistant Robin des Airs.\nVotre dossier part en <b>2 minutes</b> : je vous pose quelques questions, vous signez, on s'occupe de tout.\n<small>0 € d'avance · 0 € sans résultat · jusqu'à 600 € par personne (CE 261/2004)</small>", function(){
      askIncident();
    });
  }
  function askIncident(){
    botSays("✈️ Que s'est-il passé avec votre vol ?", function(){
      quick([
        { t: '⏱️ Retard de 3 h ou +', f: function(){ pick('delay'); } },
        { t: '🚫 Vol annulé',        f: function(){ pick('cancel'); } },
        { t: "🛑 Refus d'embarquement", f: function(){ pick('denied'); } },
      ]);
      function pick(k){ S.incident = k; meSays(INCIDENT_LABEL[k]); afterAnswer(askFlight); }
    });
  }
  function askFlight(){
    botSays("🔎 Votre <b>numéro de vol</b> ? <small>Il est sur votre billet (ex. AF719, SN204)</small>", function(){
      var q = quick([{ t: 'Je ne l’ai pas', ghost: true, f: function(){ meSays('Je ne l’ai pas'); askRoute(); } }]);
      ask('ex. AF719', {
        validate: function(v){
          var c = v.toUpperCase().replace(/\s+/g,'');
          return /^[A-Z]{1,3}\d{1,5}[A-Z]?$/.test(c) ? '' : 'Ce numéro ne ressemble pas à un vol (ex. AF719). Ou touchez « Je ne l’ai pas ».';
        },
        done: function(v){ q.remove(); S.flightNum = v.toUpperCase().replace(/\s+/g,''); S.dep = ''; S.arr = ''; afterAnswer(askDate); },
      });
    });
  }
  function askRoute(){
    botSays("🗺️ Votre <b>trajet</b> alors ? <small>ex. Dakar → Paris (écrivez « Dakar - Paris »)</small>", function(){
      ask('ex. Dakar - Paris', {
        validate: function(v){
          var p = v.split(/→|->|—|,|\/|-/).map(function(x){ return x.trim(); }).filter(Boolean);
          return (p.length >= 2 && p[0].length >= 2 && p[1].length >= 2) ? '' : 'Écrivez les deux villes, ex. « Dakar - Paris ».';
        },
        done: function(v){
          var p = v.split(/→|->|—|,|\/|-/).map(function(x){ return x.trim(); }).filter(Boolean);
          S.dep = p[0]; S.arr = p[p.length - 1]; S.flightNum = '';
          afterAnswer(askDate);
        },
      });
    });
  }
  function askDate(){
    botSays("📅 La <b>date du vol</b> ?", function(b){
      var w = document.createElement('div'); w.className = 'dt';
      var d = document.createElement('input'); d.type = 'date';
      d.max = new Date().toISOString().slice(0, 10); // un vol se réclame après coup, jamais dans le futur
      w.appendChild(d); b.appendChild(w); scrollEnd();
      d.addEventListener('change', function(){
        if (!d.value) return;
        S.date = d.value; w.remove();
        meSays(d.value.split('-').reverse().join('/'));
        afterAnswer(askPax);
      });
      setTimeout(function(){ try { d.showPicker ? d.showPicker() : d.focus(); } catch(_) { d.focus(); } }, 300);
    });
  }
  function askPax(){
    botSays("👪 Combien de <b>passagers</b> sur ce vol ? <small>Chaque billet compte — jusqu'à 600 € par personne</small>", function(){
      quick([1,2,3,4,5].map(function(n){
        return { t: n + (n === 1 ? ' passager' : ' passagers'), f: function(){ S.pax = n; meSays(String(n)); afterAnswer(askPassport); } };
      }).concat([{ t: '6 ou +', f: function(){
        meSays('6 ou +');
        ask('Nombre de passagers (ex. 7)', {
          inputmode: 'numeric',
          validate: function(v){ var n = parseInt(v, 10); return (n >= 6 && n <= 30) ? '' : 'Indiquez un nombre entre 6 et 30.'; },
          done: function(v){ S.pax = parseInt(v, 10); afterAnswer(askPassport); },
        });
      } }]));
    });
  }
  // ── Passeport : glisser-déposer → OCR → confirmation en 1 tap ──────────────
  function askPassport(){
    botSays("🛂 <b>Votre passeport</b> (ou carte d'identité) — glissez-le ici ou prenez-le en photo : <b>je lis tout, vous n'écrivez rien.</b>", function(b){
      var drop = document.createElement('div'); drop.className = 'drop';
      drop.innerHTML = '<div class="big">📄</div><p>Glissez votre pièce ici · ou touchez pour choisir</p><small>Photo ou PDF · lecture automatique · 🔒 lue par une IA pour pré-remplir, jamais revendue</small>';
      b.appendChild(drop); scrollEnd();
      var q = quick([{ t: '✏️ Je préfère taper mon nom', ghost: true, f: function(){ meSays('Je préfère taper mon nom'); askNameManual(); } }]);
      function cleanup(){ drop.remove(); q.remove(); }
      drop.addEventListener('click', function(){ $('fileInp').value = ''; $('fileInp').click(); });
      drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
      drop.addEventListener('drop', function(e){
        e.preventDefault(); drop.classList.remove('over');
        var f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f, cleanup);
      });
      $('fileInp').onchange = function(){ var f = $('fileInp').files && $('fileInp').files[0]; if (f) handleFile(f, cleanup); };
    });
  }
  // Compression côté client (max 1600 px, JPEG) : OCR rapide, payload léger même depuis un téléphone
  function toJpeg(file){
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){
        var MAX = 1600, w = img.width, h = img.height;
        if (Math.max(w, h) > MAX) { var k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  function handleFile(file, cleanup){
    if (file.size > 15 * 1024 * 1024) { botSays('😅 Ce fichier est très lourd — reprenez une photo simple de la pièce.'); return; }
    cleanup();
    meSays('📎 ' + (file.name || 'photo'));
    if (/pdf$/i.test(file.type)) {
      // PDF : on le garde pour le dossier (dépôt après signature), mais l'OCR web lit les photos → nom tapé
      var r = new FileReader();
      r.onload = function(){ S.pieceFile = { dataBase64: String(r.result).split(',')[1], mime: 'application/pdf', filename: file.name || 'passeport.pdf' }; };
      r.readAsDataURL(file);
      botSays('✅ Document reçu — il rejoindra votre dossier.', function(){ askNameManual(); });
      return;
    }
    var reading = bubble('🔍 Je lis votre pièce…', false);
    toJpeg(file).then(function(b64){
      S.pieceFile = { dataBase64: b64, mime: 'image/jpeg', filename: (file.name || 'passeport') + '.jpg' };
      return fetch('/api/ocr-piece', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataBase64: b64, mime: 'image/jpeg' }),
      }).then(function(r){ return r.json(); });
    }).then(function(j){
      reading.parentElement.remove();
      if (j && j.ok && j.piece && j.piece.name) return confirmPiece(j.piece);
      botSays("😕 Je n'arrive pas à bien lire (photo sombre ou floue ?). Pas grave — dites-moi votre nom :", function(){ askNameManual(true); });
    }).catch(function(){
      reading.parentElement.remove();
      botSays('😕 Petit souci de lecture — dites-moi votre nom :', function(){ askNameManual(true); });
    });
  }
  function confirmPiece(p){
    var card = '<div class="idcard"><div>👤 <b>' + esc(p.name) + '</b></div>'
      + (p.dob ? '<div>🎂 Né(e) le ' + esc(p.dob) + (p.lieuNaissance ? ' à ' + esc(p.lieuNaissance) : '') + '</div>' : '')
      + (p.docType ? '<div>🪪 ' + esc(p.docType === 'cni' ? "Carte d'identité" : p.docType === 'titre_sejour' ? 'Titre de séjour' : 'Passeport') + '</div>' : '')
      + '</div>';
    botSays("📋 Voilà ce que j'ai lu :" + card + "C'est bien vous ?", function(){
      quick([
        { t: '✅ C’est moi', f: function(){
          meSays('C’est moi');
          S.piece = p; S.names[0] = p.name;
          afterAnswer(nextAfterIdentity);
        } },
        { t: '✏️ Corriger', ghost: true, f: function(){ meSays('Corriger'); askNameManual(true); } },
      ]);
    });
  }
  function askNameManual(noIntro){
    var go = function(){
      ask('Prénom Nom (ex. Awa Diallo)', {
        autocomplete: 'name',
        validate: function(v){ return v.split(/\s+/).filter(Boolean).length >= 2 ? '' : 'Indiquez votre prénom ET votre nom.'; },
        done: function(v){ S.piece = null; S.names[0] = v.toUpperCase(); afterAnswer(nextAfterIdentity); },
      });
    };
    if (noIntro) go();
    else botSays('👤 Votre <b>prénom et nom</b> ?', go);
  }
  function nextAfterIdentity(){ if (S.pax > 1 && S.names.length < S.pax) return askOtherNames(); askPhone(); }
  function askOtherNames(){
    botSays('👥 Les <b>autres passagers</b> ? <small>Un nom par ligne — ou passez, un expert les notera au téléphone</small>', function(){
      var q = quick([{ t: '⏭️ Plus tard, au téléphone', ghost: true, f: function(){ meSays('Plus tard'); afterAnswer(askPhone); } }]);
      ask('Un nom par ligne', {
        validate: function(v){ return v ? '' : 'Écrivez les noms, ou touchez « Plus tard ».'; },
        done: function(v){
          q.remove();
          v.split(/\n|,|;/).map(function(x){ return x.trim(); }).filter(Boolean).slice(0, S.pax - 1)
            .forEach(function(n, i){ S.names[i + 1] = n.toUpperCase(); });
          afterAnswer(askPhone);
        },
      });
    });
  }
  function askPhone(){
    botSays("📞 Votre <b>numéro de téléphone</b> ? <small>Un expert vous rappelle depuis le +33 7 56 86 36 30 — enregistrez-le</small>", function(){
      ask('+33 6 12 34 56 78', {
        type: 'tel', inputmode: 'tel', autocomplete: 'tel',
        validate: function(v){ return v.replace(/\D/g, '').length >= 8 ? '' : 'Ce numéro semble trop court (8 chiffres minimum).'; },
        done: function(v){ S.phone = v; afterAnswer(askEmail); },
      });
    });
  }
  function askEmail(){
    botSays("📧 Votre <b>email</b> ? <small>On vous y envoie votre contrat signé (obligatoire pour la signature électronique)</small>", function(){
      ask('vous@email.com', {
        type: 'email', inputmode: 'email', autocomplete: 'email',
        validate: function(v){ return (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) && v.length <= 254) ? '' : 'Vérifiez votre adresse email.'; },
        done: function(v){ S.email = v; afterAnswer(showRecap); },
      });
    });
  }
  // Après chaque réponse : correction depuis le récap → retour direct au récap (jamais de marche arrière)
  function afterAnswer(next){ if (editReturn) { editReturn = false; showRecap(); } else next(); }

  // ── Récapitulatif + signature (le SEUL écran avec plus d'un geste) ─────────
  function showRecap(){
    var vol = S.flightNum || (S.dep && S.arr ? S.dep + ' → ' + S.arr : '—');
    var rows = [
      ['Vol',      esc(vol),                                          function(){ editReturn = true; askFlight(); }],
      ['Date',     esc((S.date || '').split('-').reverse().join('/')), function(){ editReturn = true; askDate(); }],
      ['Incident', esc(INCIDENT_LABEL[S.incident] || '—'),            function(){ editReturn = true; askIncident(); }],
      ['Vous',     esc(S.names[0] || '—') + (S.pax > 1 ? ' <small>+ ' + (S.pax - 1) + ' passager(s)</small>' : ''), function(){ editReturn = true; askNameManual(); }],
      ['Contact',  esc(S.phone) + '<br>' + esc(S.email),              function(){ editReturn = true; askPhone(); }],
    ];
    botSays("🎯 <b>Tout y est !</b> Vérifiez d'un coup d'œil, signez, et on récupère jusqu'à <b>" + (600 * S.pax) + " €</b> pour vous.", function(b){
      var rec = document.createElement('div'); rec.className = 'recap';
      rows.forEach(function(r){
        var d = document.createElement('div'); d.className = 'r';
        d.innerHTML = '<span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span>';
        var e = document.createElement('button'); e.className = 'e'; e.type = 'button'; e.title = 'Corriger'; e.textContent = '✏️';
        e.addEventListener('click', r[2]);
        d.appendChild(e); rec.appendChild(d);
      });
      b.appendChild(rec);

      // Signature
      var sig = document.createElement('div'); sig.className = 'sig';
      sig.innerHTML = '<canvas></canvas><span class="ph">✍️ Signez ici avec le doigt ou la souris</span><button type="button" class="clr">Effacer</button>';
      b.appendChild(sig);
      var canvas = sig.querySelector('canvas'), ph = sig.querySelector('.ph'), clr = sig.querySelector('.clr');
      var ctx, drawn = false;
      function setup(){
        canvas.width = canvas.offsetWidth * 2; canvas.height = 220; // x2 = net sur écrans Retina
        ctx = canvas.getContext('2d'); ctx.scale(2, 2);
        ctx.strokeStyle = '#0B1F3A'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      }
      setTimeout(setup, 60);
      function pt(e){
        var r = canvas.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      var down = false;
      function startDraw(e){ e.preventDefault(); down = true; drawn = true; ph.style.display = 'none'; clr.style.display = 'block'; var p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); refresh(); }
      function moveDraw(e){ if (!down) return; e.preventDefault(); var p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', function(){ down = false; });
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', function(){ down = false; });
      clr.addEventListener('click', function(){ ctx.clearRect(0, 0, canvas.width, canvas.height); drawn = false; ph.style.display = 'grid'; clr.style.display = 'none'; refresh(); });

      // Consentements : 2 obligatoires + exécution immédiate FACULTATIVE (art. L.221-25, aligné mandat classique)
      function ckRow(id, html){
        var l = document.createElement('label'); l.className = 'ck';
        l.innerHTML = '<input type="checkbox" id="' + id + '"><span>' + html + '</span>';
        b.appendChild(l); return l.querySelector('input');
      }
      var ck1 = ckRow('ckM', "J'accepte le <b>contrat de cession de créance</b> : je cède ma créance à Robin des Airs (<b>0 €</b> sans résultat, commission au succès uniquement) — <a href='/autorisation.html' target='_blank' rel='noopener'>lire le contrat</a>.");
      var ck2 = ckRow('ckR', "J'accepte la <a href='/politique-confidentialite.html' target='_blank' rel='noopener'>politique de confidentialité</a>.");
      var ck3 = ckRow('ckE', "<b>Facultatif :</b> démarrer <b>tout de suite</b>, sans attendre la fin de mes 14 jours de rétractation (art. L.221-25) — je reste libre de me rétracter, sans frais.");

      var go = document.createElement('button'); go.className = 'go'; go.type = 'button'; go.disabled = true;
      go.textContent = '✍️ Signer et envoyer mon dossier';
      b.appendChild(go);
      var se = document.createElement('div'); se.className = 'suberr'; b.appendChild(se);

      function refresh(){ go.disabled = !(drawn && ck1.checked && ck2.checked); }
      [ck1, ck2, ck3].forEach(function(c){ c.addEventListener('change', refresh); });
      canvas.addEventListener('mouseup', refresh); canvas.addEventListener('touchend', refresh);

      go.addEventListener('click', function(){
        if (go.disabled) return;
        S.startNow = ck3.checked;
        go.disabled = true; go.textContent = '⏳ Envoi en cours…'; se.classList.remove('on');
        submit(canvas.toDataURL('image/png')).catch(function(e){
          go.disabled = false; go.textContent = '✍️ Signer et envoyer mon dossier';
          se.innerHTML = '⚠️ ' + esc(e.message || 'Envoi impossible.') + ' Réessayez, ou <a href="https://wa.me/33756863630" target="_blank" rel="noopener">continuez sur WhatsApp</a>.';
          se.classList.add('on'); scrollEnd();
        });
      });
      scrollEnd();
    });
  }

  // ── Soumission : depot-create → submit-mandat → depot-upload (pièce) ───────
  function submit(sigPng){
    if ($('website').value) return Promise.reject(new Error('Envoi impossible.')); // honeypot
    var nowIso = new Date().toISOString();
    var full = (S.names[0] || '').trim();
    var parts = full.split(/\s+/).filter(Boolean);
    var firstName = S.piece && S.piece.prenom ? S.piece.prenom : (parts[0] || '');
    var lastName  = S.piece && S.piece.nom ? S.piece.nom : parts.slice(1).join(' ');
    var names = S.names.filter(Boolean);
    var passengersData = names.map(function(n, i){
      if (i === 0 && S.piece) return { name: n, prenom: S.piece.prenom || '', nom: S.piece.nom || '', dob: S.piece.dob || '', birth: S.piece.lieuNaissance || '' };
      return { name: n };
    });
    return fetch('/api/depot-create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: full, phone: S.phone, email: S.email,
        flightNum: S.flightNum, route: (S.dep && S.arr) ? (S.dep + ' → ' + S.arr) : '',
        dep: S.dep, arr: S.arr, date: S.date, incident: S.incident,
        pax: S.pax, passengers: passengersData, website: $('website').value,
      }),
    })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok || !j.ref) throw new Error((j && j.error) || 'Création du dossier impossible.');
      REF = j.ref;
    }); })
    .then(function(){
      // Contrat IDENTIQUE à mandat.html (clés attendues par submit-mandat.js)
      return fetch('/api/submit-mandat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ref: REF, lang: 'fr',
          firstName: firstName, lastName: lastName,
          whatsapp: S.phone, contactPhone: S.phone,
          contactEmail: S.email, email: S.email,
          address: (S.piece && S.piece.adresse) || '',
          startNow: S.startNow, // FACULTATIF (art. L.221-25) — non coché = MED après les 14 j de rétractation
          eligibilityAcknowledged: true,
          coPassAgreement: S.pax > 1,
          cessionCreance: true, mandataireAccepted: true,
          mandataireName: 'Robin des Airs, Service recouvrement CE 261/2004',
          mandataireAcceptedAt: nowIso,
          airline: (S.dep && S.arr && !S.flightNum) ? (S.dep + ' → ' + S.arr) : '',
          operatedBy: '', flightNum: S.flightNum, flightDate: S.date,
          pnr: '', incident: S.incident, pax: S.pax,
          passengerNames: names, passengersData: passengersData,
          depAirport: S.dep, arrAirport: S.arr, connecting: '', flightMode: 'direct', flightLegs: null,
          signCity: '', signDate: nowIso.slice(0, 10),
          signatureImg: sigPng,
          source: 'depot-express.html', signedAt: nowIso,
          mandatVersion: 'web-express-v2-chat', watiConversationId: S.phone, linkSentAt: '',
        }),
      });
    })
    .then(function(r){
      if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error((j && j.error) || ('Erreur ' + r.status)); });
      // La pièce lue rejoint le dossier (best-effort — le succès de la signature n'en dépend pas)
      if (S.pieceFile) {
        fetch('/api/depot-upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: REF, filename: S.pieceFile.filename, mime: S.pieceFile.mime, dataBase64: S.pieceFile.dataBase64, kind: 'identite', passenger: names[0] || '' }),
        }).catch(function(){});
      }
      success();
    });
  }
  function success(){
    var pieces = '/depot-en-ligne.html?r=' + encodeURIComponent(REF);
    botSays("🎉 <b>C'est signé, merci de votre confiance !</b>\nRéférence : <b>" + esc(REF) + "</b>\n\n📞 Un expert vous appelle depuis le <b>+33 7 56 86 36 30</b> — enregistrez-le sous « Robin des Airs ».\n" + (S.pieceFile ? '📎 Votre pièce est déjà au dossier. Ajoutez la carte d’embarquement ou l’e-billet et tout est complet.' : '📎 Dernière étape : ajoutez vos pièces (identité + carte d’embarquement).'), function(){
      quick([{ t: '📎 Ajouter mes pièces →', f: function(){ window.location.href = pieces; } }]);
      setTimeout(function(){ window.location.href = pieces; }, 6000);
    });
  }

  start();
})();
</script>
