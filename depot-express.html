  <style>
    /* ── Tunnel « un écran = une question » aux couleurs du site.
         Un clic sur une option = réponse enregistrée + écran suivant (aucun bouton Valider).
         Les réponses restent visibles en chips sous la barre de progression : un tap = correction. ── */

    /* Barre de progression fine */
    .prog{height:5px; background:var(--line); border-radius:var(--radius-pill); overflow:hidden; margin:2px 0 10px}
    .prog i{display:block; height:100%; width:0; border-radius:var(--radius-pill);
      background:linear-gradient(90deg,var(--neon),var(--neon-b)); transition:width .25s var(--ease)}

    /* Chips récap : tout ce qui est rempli reste affiché, cliquable pour corriger */
    .crumbs{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 14px; min-height:0}
    .crumbs button{
      display:inline-flex; align-items:center; gap:6px; max-width:100%;
      font:inherit; font-size:12.5px; font-weight:700; color:var(--navy);
      background:var(--green-tint); border:1px solid var(--green-line); border-radius:var(--radius-pill);
      padding:7px 12px; cursor:pointer; transition:.13s; animation:rise .25s var(--ease) both;
    }
    .crumbs button:hover{border-color:var(--neon-dark); background:#dff4ea}
    .crumbs button .x{font-size:11px; opacity:.65}
    .crumbs button b{font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px}

    /* Écrans : transition rapide (160 ms), jamais d'attente */
    .screen{animation:slidein .18s var(--ease) both}
    @keyframes slidein{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}
    .screen.backwards{animation:slideback .18s var(--ease) both}
    @keyframes slideback{from{opacity:0; transform:translateX(-14px)}to{opacity:1; transform:none}}
    .screen h2{font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--navy); margin:2px 0 4px}
    .screen .sub{color:var(--ink-soft); font-size:14px; margin:0 0 12px}

    /* Options rectangulaires : LA réponse = un clic */
    .opts{display:flex; flex-direction:column; gap:9px}
    .opts.grid2{display:grid; grid-template-columns:1fr 1fr; gap:9px}
    .opts button{
      display:flex; align-items:center; gap:12px; width:100%; text-align:left;
      min-height:56px; padding:13px 16px;
      background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-sm);
      font:inherit; font-size:15px; font-weight:700; color:var(--navy); cursor:pointer;
      transition:border-color .12s, background .12s, transform .08s;
      box-shadow:var(--shadow-card);
    }
    .opts button .ic{flex:0 0 34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:17px; background:var(--green-tint)}
    .opts button small{display:block; font-weight:500; font-size:12.5px; color:var(--muted); margin-top:1px}
    .opts button:hover{border-color:var(--neon); background:var(--green-tint)}
    .opts button:active,.opts button.hit{transform:scale(.985); border-color:var(--neon-dark); background:var(--green-tint)}
    .opts button.ghost{box-shadow:none; border-style:dashed; color:var(--ink-soft); font-weight:600}

    /* Saisie : Entrée ou ➜ envoie */
    .askrow{display:flex; gap:9px; align-items:stretch}
    .askrow .input{flex:1; min-width:0; font-size:16px}
    .askrow .ok{
      flex:0 0 54px; border:0; border-radius:var(--radius-sm); cursor:pointer; font-size:20px; color:#06351f;
      background:linear-gradient(135deg,var(--neon),var(--neon-b)); box-shadow:var(--shadow-btn); transition:.12s;
    }
    .askrow .ok:active{transform:scale(.96)}

    /* Date segmentée : Jour · Mois · Année */
    .seg-date{display:flex; gap:8px}
    .seg-date input{text-align:center}
    .seg-date input:first-child{flex:0 0 76px}
    .seg-date select{flex:1; min-width:0}
    .seg-date input:last-child{flex:0 0 96px}
    /* Dépôt passeport */
    .drop{
      border:2px dashed var(--neon); border-radius:var(--radius-sm); background:var(--green-tint);
      padding:22px 16px; text-align:center; cursor:pointer; transition:.15s;
    }
    .drop.over{background:#dff4ea; border-color:var(--neon-dark)}
    .drop.busy{border-style:solid; cursor:default}
    .spin{width:26px; height:26px; border:3px solid var(--green-line); border-top-color:var(--neon-dark); border-radius:50%; margin:0 auto; animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .drop .big{font-size:32px; line-height:1}
    .drop p{font-size:14px; color:var(--neon-ink); font-weight:800; margin:7px 0 0}
    .drop small{display:block; color:var(--muted); font-weight:500; font-size:11.5px; margin-top:4px}
    /* Encadré « Pourquoi on demande cette pièce ? », rassure et réduit l'abandon (surtout passeport) */
    .why{margin:10px 0 2px; font-size:12.5px; line-height:1.55; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 12px}
    .why b{color:var(--navy)}
    .idcard{margin:0 0 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; font-size:14.5px; color:var(--navy)}
    .idcard div{padding:2px 0}
    /* Révélation « magie » de l'extraction e-billet : les infos lues apparaissent une à une */
    .reveal-card{background:var(--surface-2); border:1.5px solid var(--green-line); border-radius:var(--radius-sm); padding:6px 16px; margin:4px 0 2px; overflow:hidden}
    .reveal-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); opacity:0; transform:translateY(7px); animation:reveal-in .4s cubic-bezier(.2,.8,.3,1) forwards}
    .reveal-row:first-child{border-top:0}
    .reveal-row .ic{flex:0 0 24px; font-size:17px; text-align:center}
    .reveal-row .txt{display:flex; flex-direction:column; min-width:0; flex:1}
    .reveal-row .k{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted)}
    .reveal-row .v{font-size:15px; font-weight:700; color:var(--navy); word-break:break-word}
    .reveal-row .chk{margin-left:auto; color:var(--neon-dark); font-weight:800; flex:0 0 auto}
    @keyframes reveal-in{to{opacity:1; transform:none}}

    /* Retour : discret, toujours là quand on peut reculer */
    .navrow{display:flex; align-items:center; justify-content:space-between; margin-top:16px; min-height:24px}
    .navrow .prev{border:0; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--muted); padding:6px 2px}
    .navrow .prev:hover{color:var(--navy)}
    .navrow .skip{border:0; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--muted); text-decoration:underline; padding:6px 2px}
    .navrow .skip:hover{color:var(--navy)}

    /* Signature */
    .sig{border:1.5px dashed var(--line-2); border-radius:var(--radius-sm); background:#fff; position:relative; touch-action:none; margin:12px 0 0}
    .sig canvas{display:block; width:100%; height:118px; border-radius:var(--radius-sm); touch-action:none}
    .sig .ph{position:absolute; inset:0; display:grid; place-items:center; color:#9aa7b6; font-size:13.5px; pointer-events:none}
    .sig .clr{position:absolute; top:7px; right:7px; border:1px solid var(--line); background:#fff; border-radius:var(--radius-pill); font-size:11.5px; font-weight:700; color:var(--muted); padding:4px 11px; cursor:pointer; display:none}
    /* Encadré « l'essentiel » (repris du mandat) */
    .ss-box{background:var(--surface-2); border:1px solid var(--green-line); border-radius:var(--radius-sm); padding:13px 15px; margin:0 0 6px}
    .ss-box .ss-h{font-weight:800; color:var(--navy); font-size:14.5px; margin-bottom:7px}
    .ss-box ul{margin:0; padding:0; list-style:none}
    .ss-box li{font-size:13px; line-height:1.5; color:var(--ink-soft); padding:3px 0}
    .ss-box li b{color:var(--navy)}
    .ss-box .ss-link{display:inline-block; margin-top:9px; font-size:13.5px; font-weight:800; color:var(--neon-ink); text-decoration:none}
    .ss-box .ss-link:hover{text-decoration:underline}
    /* Récap CONCRET du dossier (écran signature) : ce que la personne a saisi, en clair + modifiable */
    .recap{background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-sm); margin:0 0 12px; overflow:hidden}
    .recap-h{display:flex; align-items:center; gap:7px; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); font-weight:800; font-size:13.5px; color:var(--navy)}
    .recap-row{display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border-top:1px solid var(--line)}
    .recap-row:first-of-type{border-top:0}
    .recap-ic{flex:0 0 22px; font-size:15px; line-height:1.35; text-align:center}
    .recap-main{flex:1; min-width:0}
    .recap-k{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:1px}
    .recap-v{font-size:14.5px; font-weight:700; color:var(--navy); line-height:1.35; word-break:break-word}
    .recap-v .leg{display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); padding:1px 0}
    .recap-v .leg b{color:var(--navy); font-weight:800}
    .recap-v .muted{color:var(--muted); font-weight:600; font-size:13px}
    .recap-edit{flex:0 0 auto; border:1px solid var(--green-line); background:var(--green-tint); border-radius:var(--radius-pill); font:inherit; font-size:12px; font-weight:800; color:var(--neon-ink); padding:5px 11px; cursor:pointer; white-space:nowrap; align-self:center}
    .recap-edit:hover{border-color:var(--neon-dark); background:#dff4ea}
    .recap-foot{padding:9px 14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); background:var(--surface-2)}
    /* Accordéon contrat complet (texte physiquement sur la page de signature) */
    .contract-acc{border:1px solid var(--line); border-radius:var(--radius-sm); margin:0 0 8px; overflow:hidden; background:#fff}
    .contract-acc summary{cursor:pointer; padding:12px 14px; font-weight:800; font-size:13.5px; color:var(--neon-ink); list-style:none}
    .contract-acc summary::-webkit-details-marker{display:none}
    .contract-acc summary::before{content:'▸ '}
    .contract-acc[open] summary::before{content:'▾ '}
    .contract-acc .acc-body{border-top:1px solid var(--line)}
    .contract-acc iframe{width:100%; height:360px; border:0; display:block; background:#fff}
    .ck{display:flex; gap:10px; align-items:flex-start; margin-top:11px; font-size:12.9px; line-height:1.55; color:var(--ink-soft); cursor:pointer}
    .ck input{margin-top:2px; width:17px; height:17px; flex:none; accent-color:var(--neon-dark)}
    .ck a{color:var(--neon-ink); font-weight:700}
    .suberr{display:none; margin-top:10px; font-size:13px; font-weight:600; color:var(--danger); background:var(--danger-bg); border:1px solid #f3c6c0; border-radius:var(--radius-sm); padding:10px 12px}
    .suberr.on{display:block}
    .suberr a{color:var(--danger)}
    .wa-alt{margin-top:16px; font-size:12.5px; color:var(--muted); text-align:center}
    .wa-alt a{color:var(--neon-ink); font-weight:700; text-decoration:none}
  </style>
</head>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  // ── État du dossier ─────────────────────────────────────────────────────────
  var S = {
    incident: '', tiers: '', flightNum: '', dep: '', arr: '', date: '', pnr: '',
    typeVol: '',                          // direct | escale
    pax: 0, names: [], paxData: [],       // paxData[i] = { prenom, nom, dob, minor, sig, pieceFile }
    piece: null, pieceFile: null,         // passager 1 : pièce d'identité
    ticketFile: null, ticketFiles: [], fromTicket: false, // e-billet/carte(s) lu(e)s → pré-remplit vol/date/passagers (plusieurs cartes OK)
    phone: '', email: '', startNow: false,
  };
  // ── Saisie de date RAPIDE : on tape les chiffres, les / se posent seuls (15032026 → 15/03/2026).
  //    Pavé numérique sur mobile, zéro calendrier à faire défiler (crucial pour les dates de naissance).
  function isRealDate(dd, mm, yyyy){
    var d = +dd, m = +mm, y = +yyyy;
    if (!(y >= 1900 && y <= 2099) || !(m >= 1 && m <= 12) || !(d >= 1 && d <= 31)) return false;
    var dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  }
  // Date SEGMENTÉE : Jour (num) · Mois (menu déroulant, noms) · Année (num). Clair, sans ambiguïté JJ/MM,
  // pavé numérique + auto-avance. Renvoie { el, value(), focus() } ; value() = 'JJ/MM/AAAA' ou ''.
  var MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
  function segmentedDate(cfg){
    cfg = cfg || {};
    var wrap = document.createElement('div'); wrap.className = 'seg-date';
    var jj = document.createElement('input'); jj.className = 'input'; jj.inputMode = 'numeric'; jj.maxLength = 2; jj.placeholder = 'Jour'; jj.autocomplete = 'off';
    var mm = document.createElement('select'); mm.className = 'input';
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'Mois'; mm.appendChild(o0);
    MOIS.forEach(function(m, idx){ var o = document.createElement('option'); o.value = String(idx + 1).padStart(2, '0'); o.textContent = m; mm.appendChild(o); });
    // Année : menu déroulant limité à la fenêtre de prescription pour la DATE DU VOL (cfg.yearSelect)  
    // au-delà, la réclamation est prescrite, inutile de proposer l'année. La date de NAISSANCE, elle,
    // garde la saisie libre (il faut pouvoir remonter loin).
    var yy, yySelect = !!cfg.yearSelect;
    if (yySelect) {
      yy = document.createElement('select'); yy.className = 'input';
      var y0 = document.createElement('option'); y0.value = ''; y0.textContent = 'Année'; yy.appendChild(y0);
      var nowY = new Date().getFullYear(), back = cfg.yearsBack || 6; // 6 ans = couvre France 5 ans + UK 6 ans + marge
      for (var yv2 = nowY; yv2 >= nowY - back; yv2--) { var oy = document.createElement('option'); oy.value = String(yv2); oy.textContent = String(yv2); yy.appendChild(oy); }
    } else {
      yy = document.createElement('input'); yy.className = 'input'; yy.inputMode = 'numeric'; yy.maxLength = 4; yy.placeholder = 'Année'; yy.autocomplete = 'off';
    }
    wrap.appendChild(jj); wrap.appendChild(mm); wrap.appendChild(yy);
    if (cfg.value) { var pm = String(cfg.value).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (pm) { jj.value = pm[1]; mm.value = pm[2]; yy.value = pm[3]; } }
    function yval(){ return yySelect ? yy.value : yy.value.replace(/\D/g, ''); }
    function val(){ var d = jj.value.replace(/\D/g, ''), mo = mm.value, y = yval(); if (d && mo && y.length === 4) return d.padStart(2, '0') + '/' + mo + '/' + y; return ''; }
    function done(){ var v = val(); if (!v) return; var m = v.match(/(\d{2})\/(\d{2})\/(\d{4})/); if (isRealDate(m[1], m[2], m[3]) && cfg.onComplete) cfg.onComplete(v); }
    jj.addEventListener('input', function(){ jj.value = jj.value.replace(/\D/g, '').slice(0, 2); if (jj.value.length === 2) mm.focus(); });
    mm.addEventListener('change', function(){ if (jj.value && !yval()) yy.focus(); done(); });
    if (yySelect) { yy.addEventListener('change', done); }
    else { yy.addEventListener('input', function(){ yy.value = yy.value.replace(/\D/g, '').slice(0, 4); if (yy.value.length === 4) done(); }); }
    function set(v){ var m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) { jj.value = m[1].padStart(2, '0'); mm.value = m[2].padStart(2, '0'); yy.value = m[3]; } }
    return { el: wrap, value: val, set: set, focus: function(){ jj.focus(); } };
  }
  // ── Indicatifs téléphone : liste MONDIALE [nom, indicatif, ISO2]. Recherche libre + drapeau calculé
  //    depuis l'ISO. Diaspora + Europe en tête pour l'autocomplétion, France par défaut.
  var DIALS = [
    ['France', '+33', 'FR'], ['Belgique', '+32', 'BE'], ['Suisse', '+41', 'CH'], ['Luxembourg', '+352', 'LU'],
    ['Sénégal', '+221', 'SN'], ['Côte d\'Ivoire', '+225', 'CI'], ['Mali', '+223', 'ML'], ['Guinée', '+224', 'GN'], ['Guinée-Bissau', '+245', 'GW'],
    ['Cameroun', '+237', 'CM'], ['Nigeria', '+234', 'NG'], ['Ghana', '+233', 'GH'], ['Gambie', '+220', 'GM'], ['Togo', '+228', 'TG'], ['Bénin', '+229', 'BJ'],
    ['Burkina Faso', '+226', 'BF'], ['Niger', '+227', 'NE'], ['RD Congo', '+243', 'CD'], ['Congo', '+242', 'CG'], ['Mauritanie', '+222', 'MR'],
    ['Maroc', '+212', 'MA'], ['Algérie', '+213', 'DZ'], ['Tunisie', '+216', 'TN'], ['Gabon', '+241', 'GA'], ['Tchad', '+235', 'TD'],
    ['Centrafrique', '+236', 'CF'], ['Sierra Leone', '+232', 'SL'], ['Liberia', '+231', 'LR'], ['Cap-Vert', '+238', 'CV'], ['Kenya', '+254', 'KE'],
    ['Royaume-Uni', '+44', 'GB'], ['Allemagne', '+49', 'DE'], ['Italie', '+39', 'IT'], ['Espagne', '+34', 'ES'], ['Portugal', '+351', 'PT'],
    ['Pays-Bas', '+31', 'NL'], ['USA / Canada', '+1', 'US'],
    ['Afghanistan', '+93', 'AF'], ['Afrique du Sud', '+27', 'ZA'], ['Albanie', '+355', 'AL'], ['Angola', '+244', 'AO'], ['Arabie saoudite', '+966', 'SA'],
    ['Argentine', '+54', 'AR'], ['Arménie', '+374', 'AM'], ['Australie', '+61', 'AU'], ['Autriche', '+43', 'AT'], ['Azerbaïdjan', '+994', 'AZ'],
    ['Bahreïn', '+973', 'BH'], ['Bangladesh', '+880', 'BD'], ['Biélorussie', '+375', 'BY'], ['Bolivie', '+591', 'BO'], ['Bosnie-Herzégovine', '+387', 'BA'],
    ['Botswana', '+267', 'BW'], ['Brésil', '+55', 'BR'], ['Bulgarie', '+359', 'BG'], ['Burundi', '+257', 'BI'], ['Cambodge', '+855', 'KH'],
    ['Chili', '+56', 'CL'], ['Chine', '+86', 'CN'], ['Chypre', '+357', 'CY'], ['Colombie', '+57', 'CO'], ['Comores', '+269', 'KM'],
    ['Corée du Sud', '+82', 'KR'], ['Costa Rica', '+506', 'CR'], ['Croatie', '+385', 'HR'], ['Cuba', '+53', 'CU'], ['Danemark', '+45', 'DK'],
    ['Djibouti', '+253', 'DJ'], ['Égypte', '+20', 'EG'], ['Émirats arabes unis', '+971', 'AE'], ['Équateur', '+593', 'EC'], ['Érythrée', '+291', 'ER'],

      S.names[0] = (S.manualPrenom + ' ' + S.manualNom).trim();
      S.paxData[0] = Object.assign(S.paxData[0] || {}, { prenom: S.manualPrenom, nom: S.manualNom, dob: dobFr, minor: isMinor(dobFr, S.date) });
      next();
    }
    go.addEventListener('click', submitNm);
    pInp.addEventListener('keydown', function(e){ if (e.key === 'Enter') nInp.focus(); });
    nInp.addEventListener('keydown', function(e){ if (e.key === 'Enter') dobObj.focus(); });
    setTimeout(function(){ pInp.focus(); }, 120);
    navRow(sc);
  }
  // Compression photo ROBUSTE MOBILE : on réduit l'image DÈS le décodage (mémoire minimale, évite le
  // crash « mémoire insuffisante » sur iOS avec les photos 48 Mpx), on libère tout, et on échoue proprement.
  var MAXPX = 1500, JPEGQ = 0.8;
  function encodeDrawable(src, w, h, res, rej){
    if (Math.max(w, h) > MAXPX) { var k = MAXPX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    try { c.getContext('2d').drawImage(src, 0, 0, w, h); } catch (e) { if (src && src.close) try { src.close(); } catch (_) {} rej(e); return; }
    if (src && src.close) { try { src.close(); } catch (_) {} } // libère l'ImageBitmap tout de suite
    function freeCanvas(){ try { c.width = 1; c.height = 1; } catch (_) {} }
    if (c.toBlob) {
      c.toBlob(function(blob){
        if (!blob) { freeCanvas(); rej(new Error('encode')); return; }
        var fr = new FileReader();
        fr.onload = function(){ freeCanvas(); res(String(fr.result).split(',')[1]); };
        fr.onerror = function(){ freeCanvas(); rej(fr.error || new Error('read')); };
        fr.readAsDataURL(blob);
      }, 'image/jpeg', JPEGQ);
    } else {
      try { var d = c.toDataURL('image/jpeg', JPEGQ).split(',')[1]; freeCanvas(); res(d); } catch (e) { freeCanvas(); rej(e); }
    }
  }
  function toJpeg(file){
    return new Promise(function(res, rej){
      // 1) createImageBitmap AVEC réduction dès le décodage = le vrai correctif mémoire mobile.
      if (window.createImageBitmap) {
        var opt = { resizeWidth: MAXPX, resizeQuality: 'high', imageOrientation: 'from-image' };
        createImageBitmap(file, opt).then(function(bmp){ encodeDrawable(bmp, bmp.width, bmp.height, res, rej); })
          .catch(function(){
            // options resize non supportées → décodage simple puis réduction sur canvas
            createImageBitmap(file).then(function(bmp){ encodeDrawable(bmp, bmp.width, bmp.height, res, rej); })
              .catch(function(){ imgFallback(); });
          });
        return;
      }
      imgFallback();
      // 2) Repli <img> : on LIBÈRE l'URL objet (sinon fuite mémoire cumulée à chaque essai → crash).
      function imgFallback(){
        var img = new Image(), url = URL.createObjectURL(file);
        img.onload = function(){ try { encodeDrawable(img, img.naturalWidth || img.width, img.naturalHeight || img.height, res, rej); } finally { URL.revokeObjectURL(url); img.src = ''; } };
        img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
        img.src = url;
      }
    });
  }
  // Fichier → { pieceFile (à joindre au dossier), piece (OCR ou null), pdf }, réutilisé par
  // le passager 1 ET chaque co-passager (chacun peut déposer son passeport, pas seulement le 1er).
  function fileToPiece(file){
    return new Promise(function(res){
      if (/pdf$/i.test(file.type)) {
        var r = new FileReader();
        r.onload = function(){ res({ pieceFile: { dataBase64: String(r.result).split(',')[1], mime: 'application/pdf', filename: file.name || 'piece.pdf' }, piece: null, pdf: true }); };
        r.onerror = function(){ res(null); };
        r.readAsDataURL(file);
        return;
      }
      toJpeg(file).then(function(b64){
        var pieceFile = { dataBase64: b64, mime: 'image/jpeg', filename: (file.name || 'piece') + '.jpg' };
        fetch('/api/ocr-piece', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataBase64: b64, mime: 'image/jpeg' }) })
          .then(function(r){ return r.json(); })
          .then(function(j){ res({ pieceFile: pieceFile, piece: (j && j.ok && j.piece && j.piece.name) ? j.piece : null, pdf: false }); })
          .catch(function(){ res({ pieceFile: pieceFile, piece: null, pdf: false }); });
      }).catch(function(){ res(null); });
    });
  }
  // État « lecture en cours » VISIBLE sur la zone de dépôt (le client voit que ça travaille, rien ne « part » en silence).
  // Garde de taille : les PHOTOS sont compressées (aucune limite gênante) ; les PDF partent tels quels et
  // le serveur refuse au-delà de ~4 Mo → on prévient DÈS la sélection pour un PDF trop lourd.
  function tooBig(file, hint){
    var isPdf = /pdf$/i.test(file.type || '') || /\.pdf$/i.test(file.name || '');
    if (isPdf && file.size > 4 * 1000 * 1000) { hint.className = 'hint bad'; hint.textContent = 'PDF trop lourd (max ~4 Mo). Prenez plutôt une photo de la pièce, c\'est plus léger.'; return true; }
    if (file.size > 15 * 1024 * 1024) { hint.className = 'hint bad'; hint.textContent = 'Fichier très lourd, reprenez une photo simple.'; return true; }
    return false;
  }
  function dropBusy(sc, msg, sub){ var d = sc && sc.querySelector('.drop'); if (d) { d.classList.add('busy'); d.innerHTML = '<div class="spin"></div><p style="margin-top:8px">' + (msg || 'Lecture de votre pièce en cours…') + '</p><small>' + (sub || 'Quelques secondes, on récupère votre nom et votre adresse') + '</small>'; } }
  // Révélation « magie » : les infos lues sur l'e-billet apparaissent une à une, puis on avance.
  function revealEticket(sc, e, onDone){
    if (!sc) { onDone(); return; }
    var flight = e.flightNum || (e.legs && e.legs.map(function(l){ return l.num; }).filter(Boolean).join(' / ')) || '';
    var route = '';
    if (e.escale && e.legs && e.legs.length > 1) route = e.legs.map(function(l){ return (l.dep || '?') + ' → ' + (l.arr || '?'); }).join(' · ');
    else if (e.dep || e.arr) route = (e.dep || '?') + ' → ' + (e.arr || '?');
    var date = e.dateIso ? e.dateIso.split('-').reverse().join('/') : '';
    var names = (e.passengers && e.passengers.length) ? e.passengers.map(function(p){ return p.name; }).filter(Boolean).join(', ') : '';
    var rows = [];
    if (flight) rows.push(['✈️', 'Vol', flight]);
    if (route) rows.push(['🛤️', 'Trajet', route]);
    if (date) rows.push(['📅', 'Date du vol', date]);
    if (names) rows.push(['👪', (e.pax > 1 || (e.passengers && e.passengers.length > 1)) ? 'Passagers' : 'Passager', names]);
    if (!rows.length) { onDone(); return; }
    sc.innerHTML = '<h2>✨ Billet lu !</h2><p class="sub">On a extrait vos informations automatiquement. Vous les vérifierez juste après.</p>';
    var card = document.createElement('div'); card.className = 'reveal-card';
    card.innerHTML = rows.map(function(r, i){
      return '<div class="reveal-row" style="animation-delay:' + (i * 0.34).toFixed(2) + 's">'
        + '<span class="ic">' + r[0] + '</span>'
        + '<span class="txt"><span class="k">' + esc(r[1]) + '</span><span class="v">' + esc(r[2]) + '</span></span>'
        + '<span class="chk">✓</span></div>';
    }).join('');
    sc.appendChild(card);
    setTimeout(onDone, Math.max(1400, rows.length * 340 + 950));
  }
  function handleFile(file, sc, hint){
    if (tooBig(file, hint)) return;
    hint.className = 'hint idle'; hint.textContent = 'Lecture de votre pièce…'; dropBusy(sc);
    fileToPiece(file).then(function(r){
      if (!r) { hint.className = 'hint bad'; hint.textContent = 'Lecture impossible, tapez votre nom :'; setTimeout(function(){ manualName(sc); }, 600); return; }
      S.pieceFile = r.pieceFile;
      if (r.pdf) { manualName(sc); return; } // PDF : rangé au dossier, le nom se tape
      if (r.piece) return confirmPiece(sc, r.piece);
      hint.className = 'hint bad'; hint.textContent = 'Lecture difficile (photo sombre ou floue ?), tapez votre nom :';
      setTimeout(function(){ manualName(sc); }, 600);
    });
  }
  // Un fichier → { ticketFile (à joindre), eticket (OCR ou null) }. PDF : joint sans OCR (lecture = photos).
  function ocrOneEticket(file){
    return new Promise(function(res){
      if (/pdf$/i.test(file.type)) {
        var r = new FileReader();
        r.onload = function(){ res({ ticketFile: { dataBase64: String(r.result).split(',')[1], mime: 'application/pdf', filename: file.name || 'e-billet.pdf' }, eticket: null }); };
        r.onerror = function(){ res(null); };
        r.readAsDataURL(file);
        return;
      }
      toJpeg(file).then(function(b64){
        var tf = { dataBase64: b64, mime: 'image/jpeg', filename: (file.name || 'e-billet') + '.jpg' };
        fetch('/api/ocr-eticket', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataBase64: b64, mime: 'image/jpeg' }) })
          .then(function(r){ return r.json(); })
          .then(function(j){ res({ ticketFile: tf, eticket: (j && j.ok && j.eticket) ? j.eticket : null }); })
          .catch(function(){ res({ ticketFile: tf, eticket: null }); });
      }).catch(function(){ res(null); });
    });
  }
  // Fusionne plusieurs cartes d'embarquement / e-billets : vol, trajet, date, PNR pris du 1er qui les porte ;
  // passagers UNIONNÉS (dédoublonnés par nom), une carte d'embarquement = souvent un passager.
  function mergeEtickets(list){
    var c = { passengers: [], legs: [], escale: false, flightNum: '', dep: '', arr: '', dateIso: '', pnr: '', pax: 0 };
    var seen = {};
    list.forEach(function(e){
      if (!e) return;
      if (!c.flightNum && e.flightNum) c.flightNum = e.flightNum;
      if (!c.dep && e.dep) c.dep = e.dep;
      if (!c.arr && e.arr) c.arr = e.arr;
      if (!c.dateIso && e.dateIso) c.dateIso = e.dateIso;
      if (!c.pnr && e.pnr) c.pnr = e.pnr;
      if (!c.legs.length && e.escale && e.legs && e.legs.length > 1) { c.escale = true; c.legs = e.legs; }
      (e.passengers || []).forEach(function(p){
        var key = String(p && p.name || '').trim().toUpperCase().replace(/\s+/g, ' ');
        if (!key || seen[key]) return; seen[key] = 1; c.passengers.push(p);
      });
    });
    c.pax = c.passengers.length;
    return c;
  }
  // E-billet(s) / carte(s) d'embarquement : joint chaque fichier + OCR (images) → fusion → écran de validation.
  // Accepte PLUSIEURS fichiers (une carte d'embarquement par passager) sélectionnés d'un coup.
  function handleEticketFiles(fileList, hint){
    var files = Array.prototype.slice.call(fileList || []).filter(Boolean);
    if (!files.length) return;
    var sc = hint && hint.parentNode; // l'écran e-billet (pour l'état scan + la révélation)
    function dropText(msg){ var d = sc && sc.querySelector('.drop'); if (d) { d.classList.add('busy'); d.innerHTML = '<p style="margin:0;color:var(--muted)">' + msg + '</p>'; } }
    // Garde de taille (PDF trop lourd, etc.) : on écarte les fichiers refusés, on garde les valides.
    files = files.filter(function(f){ return !tooBig(f, hint); });
    if (!files.length) return;
    dropBusy(sc, files.length > 1 ? ('Lecture de vos ' + files.length + ' billets…') : 'Lecture de votre billet…', '✨ On extrait vol, trajet, date et passagers');
    // Séquentiel : évite de décoder plusieurs grosses images en parallèle (mémoire mobile).
    var results = [];
    files.reduce(function(chain, f){
      return chain.then(function(){ return ocrOneEticket(f).then(function(r){ if (r) results.push(r); }); });
    }, Promise.resolve()).then(function(){
      var ticketFiles = results.map(function(r){ return r.ticketFile; }).filter(Boolean);
      var etickets = results.map(function(r){ return r.eticket; }).filter(Boolean);
      S.ticketFiles = ticketFiles;
      S.ticketFile = ticketFiles[0] || null; // rétro-compat
      if (!etickets.length) { // aucun OCR exploitable (PDF seuls ou illisibles) → saisie classique
        dropText(ticketFiles.length ? 'Billet reçu. On continue la saisie…' : 'Billet peu lisible, on saisit à la main…');
        setTimeout(function(){ next(); }, 800);
        return;
      }
      var merged = mergeEtickets(etickets);
      applyEticket(merged);
      revealEticket(sc, merged, function(){ next(); }); // next() → écran de validation « confirm »
    });
  }
  // Depuis l'écran de validation : ajoute une carte d'embarquement de plus, la fusionne avec les infos
  // déjà lues (nouveau passager) et RE-AFFICHE l'écran de validation (sans avancer).
  function addMoreEticket(fileList, hint){
    var files = Array.prototype.slice.call(fileList || []).filter(Boolean);
    if (!files.length) return;
    files = files.filter(function(f){ return !tooBig(f, hint); });
    if (!files.length) return;
    hint.className = 'hint idle'; hint.textContent = 'Lecture de la carte d\'embarquement…';
    var results = [];
    files.reduce(function(chain, f){
      return chain.then(function(){ return ocrOneEticket(f).then(function(r){ if (r) results.push(r); }); });
    }, Promise.resolve()).then(function(){
      results.forEach(function(r){ if (r && r.ticketFile) S.ticketFiles.push(r.ticketFile); });
      S.ticketFile = S.ticketFiles[0] || S.ticketFile;
      var etickets = results.map(function(r){ return r.eticket; }).filter(Boolean);
      if (!etickets.length) { hint.className = 'hint bad'; hint.textContent = 'Carte peu lisible, réessayez avec une photo nette, ou continuez et ajoutez le passager plus tard.'; return; }
      // Instantané de l'état courant + nouvelles cartes → fusion (union des passagers).
      var cur = {
        flightNum: S.flightNum, dep: S.dep, arr: S.arr, dateIso: S.date, pnr: S.pnr,
        escale: S.typeVol === 'escale', legs: S.legs,
        passengers: (S.names || []).map(function(nm, i){ var pd = S.paxData[i] || {}; return { name: nm, dob: pd.dob, minor: pd.minor }; }).filter(function(p){ return p.name; }),
      };
      applyEticket(mergeEtickets([cur].concat(etickets)));
      render(); // ré-affiche l'écran de validation avec le passager ajouté
    });
  }
  function applyEticket(e){
    S.fromTicket = true;
    S.pnr = e.pnr || '';
    if (e.escale && e.legs && e.legs.length > 1) {
      S.typeVol = 'escale';
      S.legs = e.legs.map(function(l){ return { num: l.num || '', dep: l.dep || '', arr: l.arr || '' }; });
      S.dep = S.legs[0].dep; S.arr = S.legs[S.legs.length - 1].arr;
      S.flightNum = S.legs.map(function(l){ return l.num; }).filter(Boolean).join(' / ');
    } else {
      S.typeVol = 'direct'; S.legs = [];
      S.flightNum = e.flightNum || ''; S.dep = e.dep || ''; S.arr = e.arr || '';
    }
    if (e.dateIso) S.date = e.dateIso;
    if (e.passengers && e.passengers.length) {
      S.pax = e.pax || e.passengers.length;
      S.names = e.passengers.map(function(p){ return p.name; });
      S.paxData = e.passengers.map(function(p){
        var parts = String(p.name || '').trim().split(/\s+/);
        var nom = parts.length > 1 ? parts.pop() : (parts[0] || '');
        var prenom = parts.join(' ');
        return { prenom: prenom.toUpperCase(), nom: nom.toUpperCase(), dob: p.dob || '', minor: !!p.minor };
      });
      // Passager 1 : pré-remplit la saisie manuelle (le passeport OCR reste demandé pour la pièce d'identité)
      if (S.paxData[0]) { S.manualPrenom = S.paxData[0].prenom; S.manualNom = S.paxData[0].nom; }
    }
  }
  function confirmPiece(sc, p){
    sc.innerHTML = '<h2>📋 C\'est bien vous ?</h2><p class="sub">Lu automatiquement sur votre pièce :</p>';
    var card = document.createElement('div'); card.className = 'idcard';
    card.innerHTML = '<div>👤 <b>' + esc(p.name) + '</b></div>'
      + (p.dob ? '<div>🎂 Né(e) le ' + esc(p.dob) + (p.lieuNaissance ? ' à ' + esc(p.lieuNaissance) : '') + '</div>' : '')
      + (p.docType ? '<div>🪪 ' + esc(p.docType === 'cni' ? "Carte d'identité" : p.docType === 'titre_sejour' ? 'Titre de séjour' : 'Passeport') + '</div>' : '');
    sc.appendChild(card);
    var o = document.createElement('div'); o.className = 'opts';
    o.appendChild(optButton('<span class="ic">✅</span><span>Oui, c\'est moi</span>', function(){ S.piece = p; S.names[0] = p.name; next(); }));
    o.appendChild(optButton('<span class="ic">✏️</span><span>Corriger mon nom</span>', function(){ manualName(sc.parentElement ? sc : sc); }, true));
    sc.appendChild(o);
    navRow(sc);
  }

  // ── Soumission : depot-create → submit-mandat → depot-upload (pièce) ─────────
  function submit(sigPng){
    if ($('website').value) return Promise.reject(new Error('Envoi impossible.')); // honeypot
    var nowIso = new Date().toISOString();
    var full = (S.names[0] || '').trim();
    var parts = full.split(/\s+/).filter(Boolean);
    // Prénom/nom : la pièce OCR d'abord, sinon les cases séparées saisies à la main (jamais de découpe hasardeuse)
    var firstName = (S.piece && S.piece.prenom) || S.manualPrenom || (parts[0] || '');
    var lastName  = (S.piece && S.piece.nom) || S.manualNom || parts.slice(1).join(' ');
    var names = S.names.filter(Boolean);
    var passengersData = names.map(function(n, i){
      var pd = S.paxData[i] || {};
      var base = { name: n, prenom: pd.prenom || '', nom: pd.nom || '', dob: pd.dob || '', minor: !!pd.minor };
      if (i === 0) { base.prenom = firstName; base.nom = lastName; base.dob = (S.piece && S.piece.dob) || pd.dob || ''; if (S.piece) base.birth = S.piece.lieuNaissance || ''; base.minor = base.dob ? isMinor(base.dob, S.date) : false; }
      if (i > 0 && !pd.minor) { base.signatureImg = pd.sig || ''; base.signaturePending = !!pd.sigPending; } // co-adulte : sa signature (ou à recueillir)
      return base;
    });
    // Correspondance : tronçons structurés (le mandat bascule en mode « correspondance » et pré-remplit chaque vol)
    var isEsc = S.typeVol === 'escale' && S.legs && S.legs.length > 1;
    var legsPayload = isEsc ? S.legs.map(function(l){ return { flightNum: l.num || '', flightDate: S.date, depAirport: l.dep, arrAirport: l.arr }; }) : null;
    var viaTxt = isEsc ? ('via ' + S.legs.slice(0, -1).map(function(l){ return l.arr; }).join(', ')) : '';
    return fetch('/api/depot-create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: full, phone: S.phone, email: S.email,
        flightNum: S.flightNum, route: (S.dep && S.arr) ? (S.dep + ' → ' + S.arr) : '',
        dep: S.dep, arr: S.arr, date: S.date, incident: S.incident,
        thirdPartyFree: S.tiers === 'non', // déclare : ni avocat, ni autre société, ni procédure en cours
        pax: S.pax, passengers: passengersData, website: $('website').value,
      }),
    })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok || !j.ref) throw new Error((j && j.error) || 'Création du dossier impossible.');
      REF = j.ref;
    }); })
    .then(function(){
      // Contrat IDENTIQUE à mandat.html (clés attendues par submit-mandat.js)
      return fetch('/api/submit-mandat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ref: REF, lang: 'fr',
          firstName: firstName, lastName: lastName,
          whatsapp: S.phone, contactPhone: S.phone,
          contactEmail: S.email, email: S.email,
          address: (S.piece && S.piece.adresse) || '',
          startNow: S.startNow, // FACULTATIF (art. L.221-25), non coché = MED après les 14 j de rétractation
          eligibilityAcknowledged: true,
          coPassAgreement: S.pax > 1,
          cessionCreance: true, mandataireAccepted: true,
          mandataireName: 'Robin des Airs, Service recouvrement CE 261/2004',
          mandataireAcceptedAt: nowIso,
          airline: (S.dep && S.arr && !S.flightNum) ? (S.dep + ' → ' + S.arr) : '',
          operatedBy: '', flightNum: S.flightNum, flightDate: S.date,
          pnr: S.pnr || '', incident: S.incident, pax: S.pax,
          passengerNames: names, passengersData: passengersData,
          depAirport: S.dep, arrAirport: S.arr, connecting: viaTxt, flightMode: isEsc ? 'connecting' : 'direct', flightLegs: legsPayload,
          signCity: '', signDate: nowIso.slice(0, 10),
          signatureImg: sigPng,
          source: 'depot-express.html', signedAt: nowIso,
          mandatVersion: 'web-express-v5-draw', watiConversationId: S.phone, linkSentAt: '',
        }),
      });
    })
    .then(function(r){
      if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error((j && j.error) || ('Erreur ' + r.status)); });
      // Les pièces lues (identité de chaque passager + e-billet/carte) rejoignent le dossier.
      // On ATTEND la fin de chaque envoi avant de confirmer : sinon la redirection coupait l'upload (billet perdu).
      var uploads = [];
      if (S.pieceFile) uploads.push({ f: S.pieceFile, who: names[0] || '', kind: 'identite', label: 'Pièce d\'identité' });
      (S.paxData || []).forEach(function(pd, k){ if (k > 0 && pd && pd.pieceFile) uploads.push({ f: pd.pieceFile, who: S.names[k] || '', kind: 'identite', label: 'Pièce du passager ' + (k + 1) }); });
      // Toutes les cartes d'embarquement / e-billets déposés (une par passager le cas échéant).
      var tks = (S.ticketFiles && S.ticketFiles.length) ? S.ticketFiles : (S.ticketFile ? [S.ticketFile] : []);
      tks.forEach(function(tf, k){ uploads.push({ f: tf, who: '', kind: 'carte-embarquement', label: 'Billet ou carte d\'embarquement' + (tks.length > 1 ? ' (' + (k + 1) + '/' + tks.length + ')' : '') }); });
      return Promise.all(uploads.map(function(u){
        return fetch('/api/depot-upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: REF, filename: u.f.filename, mime: u.f.mime, dataBase64: u.f.dataBase64, kind: u.kind, passenger: u.who }),
        }).then(function(r){ return { label: u.label, kind: u.kind, ok: !!r.ok }; })
          .catch(function(){ return { label: u.label, kind: u.kind, ok: false }; });
      })).then(function(results){ success(results); });
    });
  }
  function success(results){
    results = results || [];
    var pieces = '/depot-en-ligne.html?r=' + encodeURIComponent(REF);
    $('crumbs').innerHTML = '';
    $('fill').style.width = '100%';
    stage.innerHTML = '';
    var failed = results.filter(function(x){ return !x.ok; });
    var waHref = 'https://wa.me/33756863630?text=' + encodeURIComponent('Bonjour Robin des Airs, réf. ' + REF + ', une pièce n\'est pas passée sur le formulaire, je vous l\'envoie ici.');
    // Récap CONCRET pièce par pièce : le moment où il ne faut pas aller vite, on montre ce qui est enregistré.
    var recap = results.length ? ('<div style="text-align:left;margin:14px 0;padding:12px 14px;background:#f2f7f5;border:1px solid #cfe6db;border-radius:12px">'
      + '<div style="font-weight:800;color:#0B1F3A;margin-bottom:6px">📋 Ce qui est enregistré dans votre dossier</div>'
      + results.map(function(x){ return '<div style="padding:5px 0;font-weight:700;color:' + (x.ok ? '#0b7a5b' : '#b45309') + '">' + (x.ok ? '✅' : '⚠️') + ' ' + esc(x.label) + ' : ' + (x.ok ? 'bien reçu' : 'non transmis') + '</div>'; }).join('')
      + '</div>') : '';
    var sc = document.createElement('div'); sc.className = 'screen done'; sc.style.display = 'block';
    sc.innerHTML = '<div class="seal" aria-hidden="true">' + (failed.length ? '!' : '✓') + '</div>'
      + '<h2>' + (failed.length ? 'C\'est signé, une pièce à finir' : 'C\'est signé, merci !') + '</h2>'
      + '<p>Référence : <b>' + esc(REF) + '</b></p>'
      + recap
      + (failed.length
          ? '<p>⚠️ Une pièce n\'est pas passée (souvent un fichier trop lourd). Envoyez-la en 10 secondes sur WhatsApp, on la range dans votre dossier.</p><a class="cta-link" href="' + waHref + '" target="_blank" rel="noopener">📲 Envoyer la pièce manquante sur WhatsApp →</a>'
          : '<p>📞 Un expert vous appelle depuis le <b>+33 7 56 86 36 30</b> (enregistrez-le sous « Robin des Airs »).</p><a class="cta-link" href="' + pieces + '">📎 Ajouter des tickets de dépenses (repas, taxi, hôtel) →</a>')
      + '<p class="signoff">On prend le relais. <b>L\'équipe Robin des Airs 🏹</b></p>'
      + '<p style="font-size:11.5px;color:var(--muted);margin-top:12px">Vous avez 14 jours pour vous rétracter, sans frais · <a href="/retractation.html?r=' + encodeURIComponent(REF) + '" style="color:var(--muted);text-decoration:underline">me rétracter</a></p>';
    stage.appendChild(sc);
    window.scrollTo({ top: 0 });
    if (!failed.length) setTimeout(function(){ window.location.href = pieces; }, 6000);
  }

  render();
})();
</script>
