<rect x="-90" y="0" width="900" height="900" fill="#F4F7F9"/>

<rect x="-90" y="0" width="900" height="158" fill="#0B1F3A"/>
<text x="48" y="66" font-family="'Syne',sans-serif" font-size="34" font-weight="800" fill="#00E5A0">BAGAGE RETARDÉ&#160;?</text>
<text x="48" y="104" font-family="'Montserrat',sans-serif" font-size="19" font-weight="600" fill="#C9D8E6">Les 4 étapes pour vous faire indemniser</text>
<rect x="48" y="120" width="92" height="4" rx="2" fill="#00C87A"/>

<rect x="106" y="250" width="8" height="465" fill="#9BE8CC"/>

<g>
<rect x="160" y="192" width="512" height="116" rx="16" fill="#FFFFFF" stroke="#E3EAF0" stroke-width="2"/>
<rect x="180" y="222" width="56" height="56" rx="12" fill="#E7F7F0"/>
<g transform="translate(180,222)" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="15" y="14" width="26" height="32" rx="3"/><rect x="22" y="10" width="12" height="8" rx="2" fill="#047857" stroke="none"/><line x1="21" y1="26" x2="35" y2="26"/><line x1="21" y1="34" x2="31" y2="34"/></g>
<text x="256" y="240" font-family="'Syne',sans-serif" font-size="22" font-weight="800" fill="#0B1F3A">Faites établir le PIR</text>
<text x="256" y="266" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">Au comptoir bagages, avant de sortir de</text>
<text x="256" y="286" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">l'aéroport. Sans ce document, pas de dossier.</text>
</g>

<g>
<rect x="160" y="347" width="512" height="116" rx="16" fill="#FFFFFF" stroke="#E3EAF0" stroke-width="2"/>
<rect x="180" y="377" width="56" height="56" rx="12" fill="#E7F7F0"/>
<g transform="translate(180,377)" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M16 12 h24 v34 l-4 -3 l-4 3 l-4 -3 l-4 3 l-4 -3 Z"/><line x1="21" y1="22" x2="35" y2="22"/><line x1="21" y1="30" x2="35" y2="30"/></g>
<text x="256" y="395" font-family="'Syne',sans-serif" font-size="22" font-weight="800" fill="#0B1F3A">Gardez vos justificatifs</text>
<text x="256" y="421" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">Tickets vêtements et toilette, datés</text>
<text x="256" y="441" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">pendant toute la durée du retard.</text>
</g>

<g>
<rect x="160" y="502" width="512" height="116" rx="16" fill="#FFFFFF" stroke="#E3EAF0" stroke-width="2"/>
<rect x="180" y="532" width="56" height="56" rx="12" fill="#E7F7F0"/>
<g transform="translate(180,532)"><path d="M12 30 L44 14 L33 44 L27 32 Z" fill="#047857"/></g>
<text x="256" y="550" font-family="'Syne',sans-serif" font-size="22" font-weight="800" fill="#0B1F3A">Réclamez par écrit</text>
<text x="256" y="576" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">N° PIR, montants et pièces jointes,</text>
<text x="256" y="596" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">envoyés à la compagnie aérienne.</text>
</g>

<g>
<rect x="160" y="657" width="512" height="116" rx="16" fill="#FFFFFF" stroke="#E3EAF0" stroke-width="2"/>
<rect x="180" y="687" width="56" height="56" rx="12" fill="#FFF0E9"/>
<g transform="translate(180,687)" stroke="#C1440E" stroke-width="3" fill="none" stroke-linecap="round"><circle cx="28" cy="28" r="16"/><line x1="28" y1="28" x2="28" y2="18"/><line x1="28" y1="28" x2="36" y2="31"/></g>
<text x="256" y="705" font-family="'Syne',sans-serif" font-size="22" font-weight="800" fill="#0B1F3A">Agissez sous 21 jours</text>
<text x="256" y="731" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">Délai impératif après la remise du bagage.</text>
<text x="256" y="751" font-family="'Montserrat',sans-serif" font-size="15" font-weight="600" fill="#51616F">Passé ce délai, la compagnie peut refuser.</text>
</g>

<circle cx="110" cy="250" r="32" fill="#00C87A"/><text x="110" y="260" text-anchor="middle" font-family="'Syne',sans-serif" font-size="26" font-weight="800" fill="#04241B">1</text>
<circle cx="110" cy="405" r="32" fill="#00C87A"/><text x="110" y="415" text-anchor="middle" font-family="'Syne',sans-serif" font-size="26" font-weight="800" fill="#04241B">2</text>
<circle cx="110" cy="560" r="32" fill="#00C87A"/><text x="110" y="570" text-anchor="middle" font-family="'Syne',sans-serif" font-size="26" font-weight="800" fill="#04241B">3</text>
<circle cx="110" cy="715" r="32" fill="#F0573D"/><text x="110" y="725" text-anchor="middle" font-family="'Syne',sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">4</text>

<rect x="48" y="800" width="624" height="66" rx="14" fill="#0B1F3A"/>
<circle cx="94" cy="833" r="26" fill="#2C5C88"/>
<ellipse cx="94" cy="850" rx="16" ry="12" fill="#FB7B57"/>
<circle cx="86" cy="828" r="8" fill="#fff"/><circle cx="102" cy="828" r="8" fill="#fff"/><circle cx="87" cy="830" r="4" fill="#0B1F3A"/><circle cx="103" cy="830" r="4" fill="#0B1F3A"/><polygon points="89,838 99,838 94,846" fill="#F6B93B"/>
<text x="140" y="826" font-family="'Montserrat',sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#8FA6BA">PLAFOND CONVENTION DE MONTRÉAL</text>
<text x="140" y="852" font-family="'Syne',sans-serif" font-size="22" font-weight="800" fill="#00E5A0">jusqu'à 1&#160;525&#160;€</text>
<text x="536" y="828" font-family="'Montserrat',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">0 € d'avance</text>
<text x="470" y="850" font-family="'Montserrat',sans-serif" font-size="13" font-weight="600" fill="#C9D8E6">Accompagnement WhatsApp</text>

<text x="48" y="888" font-family="'Montserrat',sans-serif" font-size="12" font-weight="600" fill="#8595A5">robindesairs.eu · indemnisation des vols Europe-Afrique</text>
